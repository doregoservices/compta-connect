<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0A1C2D">
<title>ComptaConnect — cotisations</title>
<link rel="icon" href="logomark.png">
<style>
:root{
  --bleu:#0A1C2D; --bleu2:#16283E; --vert:#1D9E75; --vert-fonce:#085041;
  --menthe:#7DCDB0; --menthe-pale:#9FE1CB; --vert-eau:#D5E8E0;
  --or:#C9A227; --creme:#FEF5DC; --rouge:#C0392B; --fond:#F7F7F5;
  --carte:#ffffff; --ligne:#e3e8e6; --muet:#5c6b76; --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",Arial,sans-serif;
  background:var(--fond);color:var(--bleu);font-size:15px;line-height:1.5}
a{color:var(--vert-fonce)}
h1,h2,h3{margin:0 0 10px}
h2{font-size:19px}h3{font-size:16px}
.mut{color:var(--muet);font-size:13px}
.topwrap{background:linear-gradient(120deg,var(--bleu),var(--bleu2));border-bottom:3px solid var(--vert)}
.top{display:flex;align-items:center;gap:10px;padding:12px 16px;max-width:1060px;margin:0 auto}
.marque{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none}
.marque img{width:38px;height:38px;border-radius:10px}
.marque .nom{font-weight:800;font-size:17px;letter-spacing:.4px}
.marque .nom b{color:var(--menthe)}
.marque .slog{font-size:10.5px;color:#bcd6cc;display:block}
.spacer{flex:1}
.nav{display:flex;gap:6px;flex-wrap:wrap;padding:0 16px 10px;max-width:1060px;margin:0 auto}
.nav a{flex-shrink:0;text-decoration:none;color:#cfe3da;font-size:13.5px;font-weight:600;
  padding:7px 13px;border-radius:99px;background:rgba(255,255,255,.08);white-space:nowrap}
.nav a.on,.nav a:hover{background:var(--vert);color:#fff}
main{max-width:1060px;margin:0 auto;padding:16px}
.carte{background:var(--carte);border:1px solid var(--ligne);border-radius:var(--r);
  padding:16px;margin-bottom:14px;box-shadow:0 1px 3px rgba(10,28,45,.05)}
.grille{display:grid;gap:12px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:820px){.g4{grid-template-columns:1fr 1fr}}
@media(max-width:560px){.g2,.g3,.g4{grid-template-columns:1fr}}
.kpi{background:var(--carte);border:1px solid var(--ligne);border-radius:var(--r);padding:13px 14px}
.kpi .t{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.3px;color:var(--muet)}
.kpi .v{font-size:21px;font-weight:800;color:var(--vert-fonce)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;background:var(--vert);color:#fff;
  border:none;border-radius:11px;padding:10px 16px;font-size:14.5px;font-weight:700;cursor:pointer;
  text-decoration:none;font-family:inherit}
.btn:active{transform:scale(.98)}
.btn.sec{background:var(--vert-eau);color:var(--vert-fonce)}
.btn.som{background:var(--bleu)}
.btn.dgr{background:var(--rouge)}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:9px}
.btn.blk{width:100%}
.btn:disabled{opacity:.5}
.champ{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.champ span{font-size:12.5px;font-weight:700;color:var(--muet)}
input,select,textarea{font-family:inherit;font-size:15px;padding:10px 12px;border:1.5px solid var(--ligne);
  border-radius:11px;background:#fff;color:var(--bleu);width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--vert)}
textarea{min-height:110px;font-size:13.5px}
table{width:100%;border-collapse:collapse;font-size:13.8px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.3px;color:var(--muet);text-align:left;
  padding:8px 9px;border-bottom:2px solid var(--vert-eau)}
td{padding:8px 9px;border-bottom:1px solid var(--ligne);vertical-align:middle}
tr:hover td{background:#f4faf7}
.survol{overflow-x:auto}
.badge{display:inline-block;padding:3px 10px;border-radius:99px;font-size:11.5px;font-weight:800;
  text-transform:uppercase;letter-spacing:.3px}
.b-paye{background:var(--vert-eau);color:var(--vert-fonce)}
.b-partiel{background:var(--creme);color:#8a6d13}
.b-impaye{background:#fbe9e7;color:var(--rouge)}
.b-avance{background:#e3ecfa;color:#2b5fa8}
.b-neutre{background:#eef1f0;color:var(--muet)}
.alerte{border-radius:11px;padding:11px 14px;margin-bottom:12px;font-size:14px}
.al-err{background:#fbe9e7;border:1px solid #eec9c4;color:#7c2d24}
.al-ok{background:var(--vert-eau);border:1px solid #bfe0d3;color:var(--vert-fonce)}
.al-info{background:var(--creme);border:1px solid #eeddb0;color:#7a6212}
.ref{font-family:ui-monospace,Consolas,monospace;font-size:24px;font-weight:800;letter-spacing:2px;
  color:var(--vert-fonce);background:var(--vert-eau);border-radius:11px;padding:12px;text-align:center}
.qr{display:flex;flex-direction:column;align-items:center;padding:10px;background:#fff;
  border:1px solid var(--ligne);border-radius:11px;width:max-content;margin:12px auto 0}
.etape{display:flex;gap:10px;margin:8px 0}
.etape .n{flex-shrink:0;width:24px;height:24px;border-radius:99px;background:var(--vert);color:#fff;
  font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center}
.hero{background:linear-gradient(135deg,var(--bleu),var(--bleu2));border-radius:var(--r);color:#fff;
  padding:26px;text-align:center;margin-bottom:14px}
.hero img{width:96px;height:96px;border-radius:20px;margin-bottom:10px}
.hero h1{font-size:24px}.hero .b{color:var(--menthe)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--bleu);color:#fff;
  padding:11px 18px;border-radius:11px;font-weight:700;font-size:14px;opacity:0;transition:.25s;
  pointer-events:none;z-index:99;max-width:90%}
#toast.ok{background:var(--vert-fonce)}#toast.err{background:var(--rouge)}#toast.on{opacity:1}
.pied{text-align:center;color:var(--muet);font-size:12.5px;padding:14px;line-height:1.7}
.avatar{width:44px;height:44px;border-radius:99px;object-fit:cover;background:var(--vert-eau);color:var(--vert-fonce);
  display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;flex-shrink:0;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.avatar.xl{width:84px;height:84px;font-size:28px}.avatar.sm{width:30px;height:30px;font-size:11px}
.bureau{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.bureau .p{text-align:center;background:var(--carte);border:1px solid var(--ligne);border-radius:var(--r);padding:14px 8px}
.bureau .p .nm{font-weight:800;font-size:13.5px;margin-top:8px}.bureau .p .ps{font-size:12px;color:var(--or);font-weight:700;text-transform:uppercase;letter-spacing:.3px}
.galerie{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:6px}
.galerie img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;cursor:pointer}
.groupe{width:100%;max-height:320px;object-fit:cover;border-radius:var(--r);display:block}
.matricule{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:800;letter-spacing:.5px;color:var(--vert-fonce)}
.cartem{display:flex;gap:14px;align-items:center;background:linear-gradient(135deg,var(--bleu),var(--bleu2));color:#fff;border-radius:var(--r);padding:14px 16px}
.cartem .matricule{color:var(--menthe)}.cartem .mut{color:#cfe3da}
</style>

<script>
/*

"use strict";
var qrcodegen;
(function (qrcodegen) {
    /*---- QR Code symbol class ----*/
    /*
     * A QR Code symbol, which is a type of two-dimension barcode.
     * Invented by Denso Wave and described in the ISO/IEC 18004 standard.
     * Instances of this class represent an immutable square grid of dark and light cells.
     * The class provides static factory functions to create a QR Code from text or binary data.
     * The class covers the QR Code Model 2 specification, supporting all versions (sizes)
     * from 1 to 40, all 4 error correction levels, and 4 character encoding modes.
     *
     * Ways to create a QR Code object:
     * - High level: Take the payload data and call QrCode.encodeText() or QrCode.encodeBinary().
     * - Mid level: Custom-make the list of segments and call QrCode.encodeSegments().
     * - Low level: Custom-make the array of data codeword bytes (including
     *   segment headers and final padding, excluding error correction codewords),
     *   supply the appropriate version number, and call the QrCode() constructor.
     * (Note that all ways require supplying the desired error correction level.)
     */
    class QrCode {
        /*-- Constructor (low level) and fields --*/
        // Creates a new QR Code with the given version number,
        // error correction level, data codeword bytes, and mask number.
        // This is a low-level API that most users should not use directly.
        // A mid-level API is the encodeSegments() function.
        constructor(
        // The version number of this QR Code, which is between 1 and 40 (inclusive).
        // This determines the size of this barcode.
        version, 
        // The error correction level used in this QR Code.
        errorCorrectionLevel, dataCodewords, msk) {
            this.version = version;
            this.errorCorrectionLevel = errorCorrectionLevel;
            // The modules of this QR Code (false = light, true = dark).
            // Immutable after constructor finishes. Accessed through getModule().
            this.modules = [];
            // Indicates function modules that are not subjected to masking. Discarded when constructor finishes.
            this.isFunction = [];
            // Check scalar arguments
            if (version < QrCode.MIN_VERSION || version > QrCode.MAX_VERSION)
                throw new RangeError("Version value out of range");
            if (msk < -1 || msk > 7)
                throw new RangeError("Mask value out of range");
            this.size = version * 4 + 17;
            // Initialize both grids to be size*size arrays of Boolean false
            let row = [];
            for (let i = 0; i < this.size; i++)
                row.push(false);
            for (let i = 0; i < this.size; i++) {
                this.modules.push(row.slice()); // Initially all light
                this.isFunction.push(row.slice());
            }
            // Compute ECC, draw modules
            this.drawFunctionPatterns();
            const allCodewords = this.addEccAndInterleave(dataCodewords);
            this.drawCodewords(allCodewords);
            // Do masking
            if (msk == -1) { // Automatically choose best mask
                let minPenalty = 1000000000;
                for (let i = 0; i < 8; i++) {
                    this.applyMask(i);
                    this.drawFormatBits(i);
                    const penalty = this.getPenaltyScore();
                    if (penalty < minPenalty) {
                        msk = i;
                        minPenalty = penalty;
                    }
                    this.applyMask(i); // Undoes the mask due to XOR
                }
            }
            assert(0 <= msk && msk <= 7);
            this.mask = msk;
            this.applyMask(msk); // Apply the final choice of mask
            this.drawFormatBits(msk); // Overwrite old format bits
            this.isFunction = [];
        }
        /*-- Static factory functions (high level) --*/
        // Returns a QR Code representing the given Unicode text string at the given error correction level.
        // As a conservative upper bound, this function is guaranteed to succeed for strings that have 738 or fewer
        // Unicode code points (not UTF-16 code units) if the low error correction level is used. The smallest possible
        // QR Code version is automatically chosen for the output. The ECC level of the result may be higher than the
        // ecl argument if it can be done without increasing the version.
        static encodeText(text, ecl) {
            const segs = qrcodegen.QrSegment.makeSegments(text);
            return QrCode.encodeSegments(segs, ecl);
        }
        // Returns a QR Code representing the given binary data at the given error correction level.
        // This function always encodes using the binary segment mode, not any text mode. The maximum number of
        // bytes allowed is 2953. The smallest possible QR Code version is automatically chosen for the output.
        // The ECC level of the result may be higher than the ecl argument if it can be done without increasing the version.
        static encodeBinary(data, ecl) {
            const seg = qrcodegen.QrSegment.makeBytes(data);
            return QrCode.encodeSegments([seg], ecl);
        }
        /*-- Static factory functions (mid level) --*/
        // Returns a QR Code representing the given segments with the given encoding parameters.
        // The smallest possible QR Code version within the given range is automatically
        // chosen for the output. Iff boostEcl is true, then the ECC level of the result
        // may be higher than the ecl argument if it can be done without increasing the
        // version. The mask number is either between 0 to 7 (inclusive) to force that
        // mask, or -1 to automatically choose an appropriate mask (which may be slow).
        // This function allows the user to create a custom sequence of segments that switches
        // between modes (such as alphanumeric and byte) to encode text in less space.
        // This is a mid-level API; the high-level API is encodeText() and encodeBinary().
        static encodeSegments(segs, ecl, minVersion = 1, maxVersion = 40, mask = -1, boostEcl = true) {
            if (!(QrCode.MIN_VERSION <= minVersion && minVersion <= maxVersion && maxVersion <= QrCode.MAX_VERSION)
                || mask < -1 || mask > 7)
                throw new RangeError("Invalid value");
            // Find the minimal version number to use
            let version;
            let dataUsedBits;
            for (version = minVersion;; version++) {
                const dataCapacityBits = QrCode.getNumDataCodewords(version, ecl) * 8; // Number of data bits available
                const usedBits = QrSegment.getTotalBits(segs, version);
                if (usedBits <= dataCapacityBits) {
                    dataUsedBits = usedBits;
                    break; // This version number is found to be suitable
                }
                if (version >= maxVersion) // All versions in the range could not fit the given data
                    throw new RangeError("Data too long");
            }
            // Increase the error correction level while the data still fits in the current version number
            for (const newEcl of [QrCode.Ecc.MEDIUM, QrCode.Ecc.QUARTILE, QrCode.Ecc.HIGH]) { // From low to high
                if (boostEcl && dataUsedBits <= QrCode.getNumDataCodewords(version, newEcl) * 8)
                    ecl = newEcl;
            }
            // Concatenate all segments to create the data bit string
            let bb = [];
            for (const seg of segs) {
                appendBits(seg.mode.modeBits, 4, bb);
                appendBits(seg.numChars, seg.mode.numCharCountBits(version), bb);
                for (const b of seg.getData())
                    bb.push(b);
            }
            assert(bb.length == dataUsedBits);
            // Add terminator and pad up to a byte if applicable
            const dataCapacityBits = QrCode.getNumDataCodewords(version, ecl) * 8;
            assert(bb.length <= dataCapacityBits);
            appendBits(0, Math.min(4, dataCapacityBits - bb.length), bb);
            appendBits(0, (8 - bb.length % 8) % 8, bb);
            assert(bb.length % 8 == 0);
            // Pad with alternating bytes until data capacity is reached
            for (let padByte = 0xEC; bb.length < dataCapacityBits; padByte ^= 0xEC ^ 0x11)
                appendBits(padByte, 8, bb);
            // Pack bits into bytes in big endian
            let dataCodewords = [];
            while (dataCodewords.length * 8 < bb.length)
                dataCodewords.push(0);
            bb.forEach((b, i) => dataCodewords[i >>> 3] |= b << (7 - (i & 7)));
            // Create the QR Code object
            return new QrCode(version, ecl, dataCodewords, mask);
        }
        /*-- Accessor methods --*/
        // Returns the color of the module (pixel) at the given coordinates, which is false
        // for light or true for dark. The top left corner has the coordinates (x=0, y=0).
        // If the given coordinates are out of bounds, then false (light) is returned.
        getModule(x, y) {
            return 0 <= x && x < this.size && 0 <= y && y < this.size && this.modules[y][x];
        }
        /*-- Private helper methods for constructor: Drawing function modules --*/
        // Reads this object's version field, and draws and marks all function modules.
        drawFunctionPatterns() {
            // Draw horizontal and vertical timing patterns
            for (let i = 0; i < this.size; i++) {
                this.setFunctionModule(6, i, i % 2 == 0);
                this.setFunctionModule(i, 6, i % 2 == 0);
            }
            // Draw 3 finder patterns (all corners except bottom right; overwrites some timing modules)
            this.drawFinderPattern(3, 3);
            this.drawFinderPattern(this.size - 4, 3);
            this.drawFinderPattern(3, this.size - 4);
            // Draw numerous alignment patterns
            const alignPatPos = this.getAlignmentPatternPositions();
            const numAlign = alignPatPos.length;
            for (let i = 0; i < numAlign; i++) {
                for (let j = 0; j < numAlign; j++) {
                    // Don't draw on the three finder corners
                    if (!(i == 0 && j == 0 || i == 0 && j == numAlign - 1 || i == numAlign - 1 && j == 0))
                        this.drawAlignmentPattern(alignPatPos[i], alignPatPos[j]);
                }
            }
            // Draw configuration data
            this.drawFormatBits(0); // Dummy mask value; overwritten later in the constructor
            this.drawVersion();
        }
        // Draws two copies of the format bits (with its own error correction code)
        // based on the given mask and this object's error correction level field.
        drawFormatBits(mask) {
            // Calculate error correction code and pack bits
            const data = this.errorCorrectionLevel.formatBits << 3 | mask; // errCorrLvl is uint2, mask is uint3
            let rem = data;
            for (let i = 0; i < 10; i++)
                rem = (rem << 1) ^ ((rem >>> 9) * 0x537);
            const bits = (data << 10 | rem) ^ 0x5412; // uint15
            assert(bits >>> 15 == 0);
            // Draw first copy
            for (let i = 0; i <= 5; i++)
                this.setFunctionModule(8, i, getBit(bits, i));
            this.setFunctionModule(8, 7, getBit(bits, 6));
            this.setFunctionModule(8, 8, getBit(bits, 7));
            this.setFunctionModule(7, 8, getBit(bits, 8));
            for (let i = 9; i < 15; i++)
                this.setFunctionModule(14 - i, 8, getBit(bits, i));
            // Draw second copy
            for (let i = 0; i < 8; i++)
                this.setFunctionModule(this.size - 1 - i, 8, getBit(bits, i));
            for (let i = 8; i < 15; i++)
                this.setFunctionModule(8, this.size - 15 + i, getBit(bits, i));
            this.setFunctionModule(8, this.size - 8, true); // Always dark
        }
        // Draws two copies of the version bits (with its own error correction code),
        // based on this object's version field, iff 7 <= version <= 40.
        drawVersion() {
            if (this.version < 7)
                return;
            // Calculate error correction code and pack bits
            let rem = this.version; // version is uint6, in the range [7, 40]
            for (let i = 0; i < 12; i++)
                rem = (rem << 1) ^ ((rem >>> 11) * 0x1F25);
            const bits = this.version << 12 | rem; // uint18
            assert(bits >>> 18 == 0);
            // Draw two copies
            for (let i = 0; i < 18; i++) {
                const color = getBit(bits, i);
                const a = this.size - 11 + i % 3;
                const b = Math.floor(i / 3);
                this.setFunctionModule(a, b, color);
                this.setFunctionModule(b, a, color);
            }
        }
        // Draws a 9*9 finder pattern including the border separator,
        // with the center module at (x, y). Modules can be out of bounds.
        drawFinderPattern(x, y) {
            for (let dy = -4; dy <= 4; dy++) {
                for (let dx = -4; dx <= 4; dx++) {
                    const dist = Math.max(Math.abs(dx), Math.abs(dy)); // Chebyshev/infinity norm
                    const xx = x + dx;
                    const yy = y + dy;
                    if (0 <= xx && xx < this.size && 0 <= yy && yy < this.size)
                        this.setFunctionModule(xx, yy, dist != 2 && dist != 4);
                }
            }
        }
        // Draws a 5*5 alignment pattern, with the center module
        // at (x, y). All modules must be in bounds.
        drawAlignmentPattern(x, y) {
            for (let dy = -2; dy <= 2; dy++) {
                for (let dx = -2; dx <= 2; dx++)
                    this.setFunctionModule(x + dx, y + dy, Math.max(Math.abs(dx), Math.abs(dy)) != 1);
            }
        }
        // Sets the color of a module and marks it as a function module.
        // Only used by the constructor. Coordinates must be in bounds.
        setFunctionModule(x, y, isDark) {
            this.modules[y][x] = isDark;
            this.isFunction[y][x] = true;
        }
        /*-- Private helper methods for constructor: Codewords and masking --*/
        // Returns a new byte string representing the given data with the appropriate error correction
        // codewords appended to it, based on this object's version and error correction level.
        addEccAndInterleave(data) {
            const ver = this.version;
            const ecl = this.errorCorrectionLevel;
            if (data.length != QrCode.getNumDataCodewords(ver, ecl))
                throw new RangeError("Invalid argument");
            // Calculate parameter numbers
            const numBlocks = QrCode.NUM_ERROR_CORRECTION_BLOCKS[ecl.ordinal][ver];
            const blockEccLen = QrCode.ECC_CODEWORDS_PER_BLOCK[ecl.ordinal][ver];
            const rawCodewords = Math.floor(QrCode.getNumRawDataModules(ver) / 8);
            const numShortBlocks = numBlocks - rawCodewords % numBlocks;
            const shortBlockLen = Math.floor(rawCodewords / numBlocks);
            // Split data into blocks and append ECC to each block
            let blocks = [];
            const rsDiv = QrCode.reedSolomonComputeDivisor(blockEccLen);
            for (let i = 0, k = 0; i < numBlocks; i++) {
                let dat = data.slice(k, k + shortBlockLen - blockEccLen + (i < numShortBlocks ? 0 : 1));
                k += dat.length;
                const ecc = QrCode.reedSolomonComputeRemainder(dat, rsDiv);
                if (i < numShortBlocks)
                    dat.push(0);
                blocks.push(dat.concat(ecc));
            }
            // Interleave (not concatenate) the bytes from every block into a single sequence
            let result = [];
            for (let i = 0; i < blocks[0].length; i++) {
                blocks.forEach((block, j) => {
                    // Skip the padding byte in short blocks
                    if (i != shortBlockLen - blockEccLen || j >= numShortBlocks)
                        result.push(block[i]);
                });
            }
            assert(result.length == rawCodewords);
            return result;
        }
        // Draws the given sequence of 8-bit codewords (data and error correction) onto the entire
        // data area of this QR Code. Function modules need to be marked off before this is called.
        drawCodewords(data) {
            if (data.length != Math.floor(QrCode.getNumRawDataModules(this.version) / 8))
                throw new RangeError("Invalid argument");
            let i = 0; // Bit index into the data
            // Do the funny zigzag scan
            for (let right = this.size - 1; right >= 1; right -= 2) { // Index of right column in each column pair
                if (right == 6)

const MOIS_FR = ["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];

function moisCourant(){ const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0"); }

function normaliserMois(mois){
  if(!mois) return moisCourant();
  const m = /^(\d{4})-(\d{1,2})$/.exec(String(mois).trim());
  if(!m) return moisCourant();
  const mm = parseInt(m[2],10);
  if(!(mm>=1 && mm<=12)) return moisCourant();
  return m[1] + "-" + String(mm).padStart(2,"0");
}
function moisCourt(mois){ return mois.slice(2,4) + mois.slice(5,7); }        // 2026-09 -> 2609
function moisSuivant(mois){
  let a = parseInt(mois.slice(0,4),10), m = parseInt(mois.slice(5,7),10);
  if(m===12){ a+=1; m=1; } else { m+=1; }
  return a + "-" + String(m).padStart(2,"0");
}
function dernierJour(mois){
  return new Date(parseInt(mois.slice(0,4),10), parseInt(mois.slice(5,7),10), 0).getDate();
}
function libelleMois(mois){ return MOIS_FR[parseInt(mois.slice(5,7),10)-1] + " " + mois.slice(0,4); }
function echeance(mois, jour){
  jour = Math.min(Math.max(jour||10,1), dernierJour(mois));
  return mois + "-" + String(jour).padStart(2,"0");
}
function reference(mois, code){ return "CC" + moisCourt(mois) + String(code).padStart(3,"0"); }

function analyserReference(texte){
  if(!texte) return null;
  const t = String(texte).toUpperCase().replace(/[^A-Z0-9]/g, "");
  let m = /CC(\d{7})/.exec(t);
  if(!m) m = /(^|[^\d])(\d{7})([^\d]|$)/.exec(t), m = m ? [m[0], m[2]] : null;
  if(!m) return null;
  const chiffres = m[1];
  const aa = parseInt(chiffres.slice(0,2),10), mm = parseInt(chiffres.slice(2,4),10), code = chiffres.slice(4,7);
  const annee = 2000 + aa;
  if(!(mm>=1 && mm<=12)) return null;
  if(!(annee>=2020 && annee<=2099)) return null;
  return [annee + "-" + String(mm).padStart(2,"0"), code];
}

/* Matricule de carte : CC-AA-NNNNN (AA = année d'attribution, NNNNN = n° d'ordre). Saisie tolérante. */
function matriculeNormaliser(texte){
  let v = String(texte||"").toUpperCase().replace(/[^0-9A-Z]/g, "");
  if(v.startsWith("CC")) v = v.slice(2);
  if(!/^\d{7}$/.test(v)) return null;
  return "CC-" + v.slice(0,2) + "-" + v.slice(2);
}
function telephoneNormalise(numero){
  /* Même règle que le serveur : tout ramener à la forme 225XXXXXXXXXX */
  let d = String(numero||"").replace(/\D/g,"");
  if(!d) return "";
  if(d.startsWith("00")) d = d.slice(2);
  if(d.startsWith("0") && [9,11,14].includes(d.length)) d = d.slice(1);
  if(d.length === 8 || d.length === 10) d = "225" + d;
  return d;
}
function accentMin(texte){
  return String(texte||"").normalize("NFKD").replace(/[\u0300-\u036f]/g,"")
    .toLowerCase().replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim();
}
function mots(texte){ return new Set(accentMin(texte).split(" ").filter(x => x.length > 2)); }
function correspondanceNom(a, b){
  const ma = mots(a), mb = mots(b);
  if(!ma.size || !mb.size) return false;
  let communs = 0;
  for(const x of ma) if(mb.has(x)) communs++;
  return communs >= 2 && communs >= Math.min(ma.size, mb.size) - 1;
}

/* Rapproche un paiement d'un membre : référence > téléphone > nom > montant. */
function rapprocherPaiement(p, membres, moisDefaut){
  if(p.statut === "RAPPROCHE" && p.methode === "manuel") return p;
  const ref = analyserReference(p.libelle);
  if(ref){
    const cand = membres.find(m => String(m.code).padStart(3,"0") === ref[1].padStart(3,"0"));
    if(cand){ p.membre_id = cand.id; p.mois = ref[0]; p.statut = "RAPPROCHE"; p.methode = "ref"; return p; }
  }
  const tel = telephoneNormalise(p.telephone);
  if(tel){
    const cands = membres.filter(m => telephoneNormalise(m.telephone) === tel);
    if(cands.length === 1){ p.membre_id = cands[0].id; p.mois = moisDefaut || p.mois;
      p.statut = "RAPPROCHE"; p.methode = "tel"; return p; }
  }
  if(p.expediteur){
    const cands = membres.filter(m => correspondanceNom(m.nom, p.expediteur));
    if(cands.length === 1){ p.membre_id = cands[0].id; p.mois = moisDefaut || p.mois;
      p.statut = "RAPPROCHE"; p.methode = "nom"; return p; }
  }
  if(moisDefaut && p.montant){
    const dus = membres.filter(m => m.actif && !m.exonere && parseInt(m.cotisation,10) === parseInt(p.montant,10));
    if(dus.length === 1){ p.membre_id = dus[0].id; p.mois = moisDefaut; p.statut = "RAPPROCHE";
      p.methode = "montant"; return p; }
  }
  p.methode = "aucun";
  return p;
}

/* Historique d'un membre depuis son adhésion : un mois par ligne, cumul dû / versé / reste. */
function moisDebutMembre(m, paiements){
  /* Règle du réseau : une seule date (l'adhésion) ; la cotisation est due à partir du mois SUIVANT le mois d'adhésion.
     Un paiement enregistré pour un mois plus ancien (ex. relevé Chariow) fait démarrer l'historique à ce mois.
     Le paramètre « debut_cotisations » (trésorier) fixe un plancher : aucun mois n'est dû avant. */
  let debut = null;
  const da = String(m.date_adhesion||"");
  if(/^\d{4}-\d{2}/.test(da)) debut = moisSuivant(da.slice(0,7));
  for(const p of paiements) if(String(p.membre_id) === String(m.id) && p.mois){
    const pm = normaliserMois(p.mois); if(!debut || pm < debut) debut = pm;
  }
  const plancher = String((typeof etat !== "undefined" && etat.settings && etat.settings.debut_cotisations) || "");
  if(/^\d{4}-\d{2}$/.test(plancher) && (!debut || debut < plancher)) debut = plancher;
  return debut || moisCourant();
}
function historiqueMembre(m, paiements, jusqua){
  jusqua = normaliserMois(jusqua || moisCourant());
  const cot = m.exonere ? 0 : parseInt(m.cotisation||0,10);
  const lignes = []; let du = 0, verse = 0;
  for(let mois = moisDebutMembre(m, paiements); mois <= jusqua; mois = moisSuivant(mois)){
    const recus = paiements.filter(p => String(p.membre_id) === String(m.id) && normaliserMois(p.mois||"0000-01") === mois);
    const v = recus.reduce((s,p)=>s+parseInt(p.montant,10),0);
    du += cot; verse += v;
    lignes.push({ mois, du: cot, verse: v, dates: recus.map(p => p.date).filter(Boolean),
      statut: cot === 0 ? "EXONERE" : v >= cot ? "PAYE" : v > 0 ? "PARTIEL" : "IMPAYE" });
    if(lignes.length > 120) break;
  }
  const avance = paiements.filter(p => String(p.membre_id) === String(m.id) && p.mois && normaliserMois(p.mois) > jusqua)
    .reduce((s,p)=>s+parseInt(p.montant,10),0);
  return { lignes, du, verse, reste: Math.max(0, du - verse), avance,
    nb_impayes: lignes.filter(l => l.statut === "IMPAYE").length, nb_partiels: lignes.filter(l => l.statut === "PARTIEL").length };
}

/* Tableau de pointage d'un mois — même calcul que le serveur. */

function pointage(membres, paiements, mois){
  mois = normaliserMois(mois);
  const lignes = [];
  let verseTotal = 0, duTotal = 0, nbPayes = 0, nbPartiels = 0, nbImpayes = 0, nbAvances = 0;
  for(const m of membres){
    if(!m.actif) continue;
    const du = m.exonere ? 0 : parseInt(m.cotisation||0,10);
    duTotal += du;
    const recus = paiements.filter(p => String(p.membre_id) === String(m.id) && normaliserMois(p.mois||"0000-01") === mois);
    const verse = recus.reduce((s,p) => s + parseInt(p.montant,10), 0);
    verseTotal += verse;
    const avances = paiements
      .filter(p => String(p.membre_id) === String(m.id) && p.mois && normaliserMois(p.mois) > mois)
      .reduce((s,p) => s + parseInt(p.montant,10), 0);
    let statut;
    if(du === 0) statut = "EXONERE";
    else if(verse >= du) statut = verse > du ? "AVANCE" : "PAYE";
    else if(verse > 0) statut = "PARTIEL";
    else statut = "IMPAYE";
    if(statut === "PAYE" || statut === "AVANCE"){ nbPayes++; if(statut === "AVANCE") nbAvances++; }
    else if(statut === "PARTIEL") nbPartiels++;
    else if(statut === "IMPAYE") nbImpayes++;
    lignes.push({ membre:m, mois, reference: reference(mois, m.code), du, verse,
      reliquat: Math.max(0, du - verse), statut, avances, nb_paiements: recus.length });
  }
  const deno = nbPayes + nbPartiels + nbImpayes;
  return { mois, libelle: libelleMois(mois), lignes, totaux:{
    du: duTotal, verse: verseTotal, manquant: Math.max(0, duTotal - verseTotal),
    nb_membres: lignes.length, nb_payes: nbPayes, nb_partiels: nbPartiels, nb_impayes: nbImpayes,
    nb_avances: nbAvances,
    taux: deno ? Math.round(1000*nbPayes/deno)/10 : 0 } };
}

function fcfa(n){ return String(parseInt(n,10)||0).replace(/\B(?=(\d{3})+(?!\d))/g, " "); }
function dateFR(iso){ if(!iso) return ""; const p = String(iso).slice(0,10).split("-"); return p.length===3 ? p[2]+"/"+p[1]+"/"+p[0] : iso; }
function aujourdhui(){ return new Date().toISOString().slice(0,10); }

  module.exports = { normaliserMois, moisCourt, moisSuivant, libelleMois, echeance, reference,
    analyserReference, telephoneNormalise, matriculeNormaliser, correspondanceNom, rapprocherPaiement, pointage, fcfa };
}

async function sb(table, options, _retente){
  options = options || {};
  if(etat.session && etat.session.role === "fondateur" && options.method && options.method !== "GET" && !/^rpc\/cc_(mon_role|bienvenue|paiement_en_ligne_dispo|appel_acces)/.test(table)){
    throw new Error("compte en consultation — vous pouvez tout voir, mais seul le trésorier peut modifier");
  }
  if(etat.session && etat.session.expire && Date.now() > etat.session.expire - 60000) await rafraichirSession();
  const entetes = Object.assign({ "apikey": etat.cfg.anon, "Content-Type":"application/json",
    "Authorization": "Bearer " + (etat.session ? etat.session.token : etat.cfg.anon) }, options.headers||{});
  const rep = await fetch(etat.cfg.url.replace(/\/$/,"") + "/rest/v1/" + table,
    Object.assign({}, options, { headers: entetes }));
  if(!rep.ok){
    const corps = await rep.text();
    // Session trésorier expirée : on la renouvelle une fois puis on rejoue la requête
    if(rep.status === 401 && etat.session && !_retente){
      if(await rafraichirSession()) return sb(table, options, true);
      deconnexion(); throw new Error("Votre session a expiré : reconnectez-vous.");
    }
    throw new Error(corps.slice(0,300));
  }
  const texte = await rep.text();
  return texte ? JSON.parse(texte) : null;      // réponses vides (création/modification) acceptées
}
async function rafraichirSession(){
  if(!etat.session || !etat.session.refresh) return false;
  try{
    const rep = await fetch(etat.cfg.url.replace(/\/$/,"") + "/auth/v1/token?grant_type=refresh_token", { method:"POST",
      headers:{ "apikey": etat.cfg.anon, "Content-Type":"application/json" }, body: JSON.stringify({ refresh_token: etat.session.refresh }) });
    if(!rep.ok) return false;
    const j = await rep.json();
    etat.session = { token: j.access_token, refresh: j.refresh_token, email: etat.session.email, expire: Date.now() + (j.expires_in||3600)*1000 };
    localStorage.setItem("cc_session", JSON.stringify(etat.session));
    return true;
  }catch(e){ return false; }
}

    sb("cc_membres?select=*&order=code.asc"),

  ]);
}

/* ---------- Identification d'un membre : matricule de carte (ou ancien code à 3 chiffres) ---------- */
function trouverMembre(saisie){
  // Accès par matricule de carte OU par numéro de téléphone (jamais par l'ancien code interne)
  const mat = matriculeNormaliser(saisie);
  if(mat) return etat.membres.find(x => x.matricule === mat) || null;
  const chiffres = String(saisie||"").replace(/\D/g, "");
  if(chiffres.length >= 8){ const tel = telephoneNormalise(chiffres); return etat.membres.find(x => x.telephone && telephoneNormalise(x.telephone) === tel) || null; }
  return null;
}
function idMembre(m){ return m.matricule || String(m.telephone||"").replace(/\D/g,""); }
function lienMembre(m, extra){ return (m.matricule ? "#/payer?m=" + encodeURIComponent(m.matricule) : "#/payer?t=" + encodeURIComponent(String(m.telephone||"").replace(/\D/g,""))) + (extra||""); }
function lienMembreAbsolu(m, extra){ return location.origin + location.pathname + lienMembre(m, extra); }
function initiales(nom){ return String(nom||"?").trim().split(/\s+/).slice(0,2).map(x => x[0]||"").join("").toUpperCase(); }
function avatar(m, taille){

  return m.photo_url ? '<img class="'+cls+'" src="'+ech(m.photo_url)+'" alt="">' : '<span class="'+cls+'">'+ech(initiales(m.nom))+'</span>';

/* ---------- Photos : compression dans le navigateur puis dépôt dans Supabase Storage (bucket cc_photos) ---------- */
function compresserImage(fichier, maxPx, qualite){
  return new Promise((ok, ko) => {
    const img = new Image(); const url = URL.createObjectURL(fichier);
    img.onload = () => {
      const r = Math.min(1, (maxPx||400) / Math.max(img.width, img.height));
      const c = document.createElement("canvas"); c.width = Math.round(img.width*r); c.height = Math.round(img.height*r);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      c.toBlob(b => b ? ok(b) : ko(new Error("Image illisible")), "image/jpeg", qualite||0.82);
    };
    img.onerror = () => ko(new Error("Fichier image illisible"));
    img.src = url;
  });
}

/* ------------------------------ QR ------------------------------ */
function qrSvg(texte, px){
  /* Dessine le QR module par module (la lib compilée n'expose que getModule) */
  const qr = qrcodegen.QrCode.encodeText(String(texte), qrcodegen.QrCode.Ecc.MEDIUM);
  const bord = 2, n = qr.size + bord*2;
  let cases = "";
  for(let y = 0; y < qr.size; y++)
    for(let x = 0; x < qr.size; x++)
      if(qr.getModule(x, y))
        cases += '<rect x="'+(x+bord)+'" y="'+(y+bord)+'" width="1" height="1"/>';
  const svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+n+' '+n+'" shape-rendering="crispEdges">'
    + '<rect width="'+n+'" height="'+n+'" fill="#fff"/>'
    + '<g fill="#0A1C2D">'+cases+'</g></svg>';
  return '<div class="qr"><div style="width:'+(px||180)+'px;height:'+(px||180)+'px">'+svg+'</div></div>';
}

/* --------------------------- Navigation --------------------------- */
function routeActuelle(){
  const h = location.hash || "#/";
  const [chemin, query] = h.slice(2).split("?");
  const params = {};
  (query||"").split("&").forEach(p => { const [k,v] = p.split("="); if(k) params[decodeURIComponent(k)] = decodeURIComponent(v||""); });
  return [chemin || "", params];
}

function rendu(){
  const [route, params] = routeActuelle();
  etat.route = route; etat.params = params;
  const app = $("#app");
  let corps = "";
  try{
    if(!etat.cfg) corps = vueInstallation();
    else if(route === "payer") corps = vuePayer(params);
    else if(route === "adherer") corps = vueAdherer();
    else if(route === "simulation") corps = vueSimulation(params);
    else if(route === "rencontres") corps = vueRencontres(params);
    else if(route === "appel") corps = vueAppelPublic(params);
    else if(route === "annonces") corps = vueAnnonces(params);
    else if(route === "marche" && !etat.session) corps = vueMarche(params);
    else if(route === "connexion") corps = vueConnexion();
    else if(route === "installer") corps = vueInstallation();
    else if(!etat.session) corps = vueAccueil();
    else if(route === "") corps = vueTableauBord();
    else if(route === "membres") corps = vueMembres();
    else if(route === "pointage") corps = vuePointage(params);
    else if(route === "paiements") corps = vuePaiements(params);
    else if(route === "parametres"){ corps = vueParametres(); setTimeout(etatCles, 0); }
    else if(route === "depenses") corps = vueDepenses();
    else if(route === "inscriptions") corps = vueInscriptions(params);
    else if(route === "solde") corps = vueSolde();
    else if(route === "appels") corps = vueAppels(params);
    else if(route === "reseau") corps = vueReseau();
    else if(route === "marche") corps = vueMarcheAdmin(params);
    else corps = vueAccueil();
  }catch(e){
    corps = '<main><div class="alerte al-err">Erreur : '+ech(e.message)+'</div></main>';

  app.innerHTML = entete() + corps

    + '<a href="https://wa.me/2250717579556" target="_blank" rel="noopener" style="color:inherit">WhatsApp</a> · <a href="mailto:nabildorego@gmail.com" style="color:inherit">Email</a></span></p>';
}

/* --------------------------- Tableau de bord --------------------------- */
/* --------------------------- Périodes (filtre commun) --------------------------- */
/* params : (rien) = tout depuis le début ; ?mois=AAAA-MM ; ?debut=AAAA-MM&fin=AAAA-MM */
function premierMoisConnu(){
  let d = null;
  for(const m of etat.membres){ const x = String(m.date_adhesion||""); if(/^\d{4}-\d{2}/.test(x) && (!d || x.slice(0,7) < d)) d = x.slice(0,7); }
  for(const p of etat.paiements){ for(const x of [p.mois, p.date]){ const y = String(x||""); if(/^\d{4}-\d{2}/.test(y)){ const n = normaliserMois(y.slice(0,7)); if(!d || n < d) d = n; } } }
  for(const dp of (etat.depenses||[])){ const y = String(dp.date||"").slice(0,7); if(/^\d{4}-\d{2}$/.test(y) && (!d || y < d)) d = y; }
  return d || moisCourant();
}
function periodeDepuisParams(params){
  const cour = moisCourant();
  if(params.mois) { const m = normaliserMois(params.mois); return { debut:m, fin:m, mode:"mois" }; }
  if(params.debut || params.fin){
    const debut = normaliserMois(params.debut || premierMoisConnu()), fin = normaliserMois(params.fin || cour);
    return { debut: debut <= fin ? debut : fin, fin: debut <= fin ? fin : debut, mode:"periode" };
  }
  return { debut: premierMoisConnu(), fin: cour, mode:"tout" };
}
function libellePeriode(per){
  if(per.mode === "mois") return libelleMois(per.debut);
  if(per.mode === "periode") return libelleMois(per.debut) + " → " + libelleMois(per.fin);
  return "depuis le début (" + libelleMois(per.debut) + " → " + libelleMois(per.fin) + ")";
}
function dansPeriode(valeur, per){
  const v = String(valeur||"").slice(0,7); if(!/^\d{4}-\d{2}$/.test(v)) return false;
  return v >= per.debut && v <= per.fin;
}
function listeMois(per){ const l = []; for(let m = per.debut; m <= per.fin && l.length < 240; m = moisSuivant(m)) l.push(m); return l; }
function barrePeriode(route, per, titre){
  const base = "#/" + route;
  return '<div class="carte" style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">'
    + '<h3 style="margin:0">'+titre+' — '+libellePeriode(per)+'</h3><span style="flex:1"></span>'
    + '<select id="perMode" style="width:auto" onchange="changerPeriode(\''+route+'\')">'

function changerPeriode(route){
  const mode = $("#perMode").value, d = $("#perDebut").value, f = $("#perFin").value;
  if(mode === "tout") aller("#/" + route);
  else if(mode === "mois") aller("#/" + route + "?mois=" + (d || moisCourant()));

}
/* Bilan cotisations d'une période : chaque membre doit sa cotisation pour chaque mois de la période depuis son adhésion. */
function bilanPeriode(per){
  const moisL = listeMois(per);
  const lignes = []; let du = 0, verse = 0;
  for(const m of etat.membres){
    if(!m.actif) continue;
    const cot = m.exonere ? 0 : parseInt(m.cotisation||0,10);
    const debutM = moisDebutMembre(m, etat.paiements);
    const moisDus = moisL.filter(x => x >= debutM);
    const paies = etat.paiements.filter(p => String(p.membre_id) === String(m.id) && dansPeriode(p.mois, per) && normaliserMois(p.mois) >= debutM);
    const d = cot * moisDus.length, v = paies.reduce((s,p)=>s+parseInt(p.montant,10),0);
    const moisPayes = new Set(paies.map(p => normaliserMois(p.mois)));
    const impayes = moisDus.filter(x => !moisPayes.has(x));
    du += d; verse += v;
    lignes.push({ membre:m, du:d, verse:v, reste: Math.max(0, d - v), nb_mois: moisDus.length, nb_impayes: impayes.length,
      statut: cot === 0 ? "EXONERE" : d === 0 ? "HORS" : v >= d ? "PAYE" : v > 0 ? "PARTIEL" : "IMPAYE" });
  }
  const concernes = lignes.filter(l => l.statut !== "EXONERE" && l.statut !== "HORS");
  const payes = concernes.filter(l => l.statut === "PAYE").length;
  return { lignes, du, verse, manquant: Math.max(0, du - verse), nb_membres: lignes.length, nb_concernes: concernes.length,
    nb_payes: payes, nb_partiels: concernes.filter(l => l.statut === "PARTIEL").length, nb_impayes: concernes.filter(l => l.statut === "IMPAYE").length,
    taux: concernes.length ? Math.round(1000*payes/concernes.length)/10 : 0 };
}
/* Téléchargements */
function telechargerCSV(nom, entetes, lignes){
  const esc = v => { v = String(v==null?"":v); return /[;"\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; };
  const csv = "\uFEFF" + [entetes, ...lignes].map(l => l.map(esc).join(";")).join("\r\n");
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv], {type:"text/csv;charset=utf-8"})); a.download = nom; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

/* ---------- Relance WhatsApp en série ----------
   WhatsApp n'autorise aucun envoi automatique à une liste sans l'API Business payante : chaque message doit être
   confirmé par un humain. Le mode « série » enchaîne les membres un par un (un clic = un WhatsApp ouvert, pré-rempli,
   déjà adressé au bon numéro) et mémorise ceux déjà relancés sur l'appareil, pour reprendre plus tard sans doublon. */
let _serie = null;
function relanceSerie(action){
  const per = periodeDepuisParams(etat.params);
  const cle = "cc_relances_" + per.debut + "_" + per.fin;
  const faits = new Set(JSON.parse(localStorage.getItem(cle) || "[]"));
  if(action === "demarrer"){
    const b = bilanPeriode(per);
    _serie = { cle, liste: b.lignes.filter(l => (l.statut === "IMPAYE" || l.statut === "PARTIEL") && l.membre.telephone).sort((x,y) => y.reste - x.reste), i: 0 };
    while(_serie.i < _serie.liste.length && faits.has(String(_serie.liste[_serie.i].membre.id))) _serie.i++;
  }
  if(!_serie) return;
  if(action === "reinit"){ if(!confirm("Oublier les relances déjà faites sur cette période et recommencer depuis le début ?")) return; localStorage.removeItem(cle); faits.clear(); _serie.i = 0; }
  if(action === "envoyer" || action === "passer"){
    const l = _serie.liste[_serie.i];
    if(l){
      if(action === "envoyer"){
        const texte = encodeURIComponent("Bonjour "+l.membre.nom.split(" ")[0]+", le réseau "+(etat.settings.reseau||"ComptaConnect")+" vous rappelle un reste de cotisation de "+fcfa(l.reste)+" FCFA ("+l.nb_impayes+" mois). Votre situation et le paiement en ligne : "+lienMembreAbsolu(l.membre)+" — Merci !");
        window.open("https://wa.me/"+telephoneNormalise(l.membre.telephone)+"?text="+texte, "_blank", "noopener");
      }
      faits.add(String(l.membre.id)); localStorage.setItem(cle, JSON.stringify([...faits]));
      _serie.i++;
    }
  }
  if(action === "arreter"){ _serie = null; $("#relanceSerie").innerHTML = ""; return; }
  const zone = $("#relanceSerie"); if(!zone) return;
  const total = _serie.liste.length, restants = _serie.liste.filter(l => !faits.has(String(l.membre.id))).length;
  const l = _serie.liste[_serie.i];
  zone.innerHTML = '<div class="carte" style="border:2px solid #25D366;background:#f0fdf4;margin-top:10px">'
    + '<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"><h3 style="margin:0">Relance en série — '+(total - restants)+' / '+total+' faites</h3><span style="flex:1"></span>'
    + '<button class="btn sm sec" onclick="relanceSerie(\'reinit\')">Recommencer</button><button class="btn sm sec" onclick="relanceSerie(\'arreter\')">Fermer</button></div>'
    + '<div style="height:8px;background:#d1fae5;border-radius:4px;margin:8px 0"><div style="height:8px;width:'+Math.round(100*(total-restants)/Math.max(1,total))+'%;background:#25D366;border-radius:4px"></div></div>'
    + (l ? '<p style="font-size:17px;margin:6px 0"><strong>'+ech(l.membre.nom)+'</strong> · '+ech(l.membre.telephone)+' · reste <strong>'+fcfa(l.reste)+' F</strong> ('+l.nb_impayes+' mois)</p>'
          + '<p class="mut">Cliquez : WhatsApp s’ouvre avec le message prêt pour ce numéro. Appuyez sur <strong>Envoyer</strong> dans WhatsApp, revenez ici, le suivant est déjà affiché.</p>'
          + '<button class="btn" style="background:#25D366" onclick="relanceSerie(\'envoyer\')">📲 Ouvrir WhatsApp et passer au suivant</button> <button class="btn sec" onclick="relanceSerie(\'passer\')">Passer celui-ci</button>'
        : '<p>✅ Tous les membres à relancer de cette période ont été traités sur cet appareil.</p>')
    + '</div>';
}

/* Net encaissé = montant payé par le membre − commission de la plateforme de paiement (Chariow hier, CinetPay demain) */
function netDe(p){ return parseInt(p.montant,10) - (parseInt(p.frais,10) || 0); }
function sommeNet(liste){ return liste.reduce((s,p) => s + netDe(p), 0); }
function sommeFrais(liste){ return liste.reduce((s,p) => s + (parseInt(p.frais,10)||0), 0); }

function rech(m, extra){ return ' data-rech="'+ech(accentMin([m.nom, m.telephone, m.matricule, m.code, m.email, m.ville, m.pays, extra].filter(Boolean).join(" ")))+'"'; }

function prochainMatricule(){
  let max = parseInt(etat.settings.matricule_depart||"0",10) || 0;
  for(const m of etat.membres){ const n = /^CC-\d{2}-(\d{5})$/.exec(m.matricule||""); if(n && parseInt(n[1],10) > max) max = parseInt(n[1],10); }
  return "CC-" + String(new Date().getFullYear()).slice(2) + "-" + String(max + 1).padStart(5,"0");
}
function prochainCode(){
  let max = 0; for(const m of etat.membres){ const c = parseInt(String(m.code).replace(/\D/g,""),10); if(c > max) max = c; }
  return String(max + 1).padStart(3,"0");
}

async function importerMembres(){
  const lignes = ($("#csvMembres").value||"").split(/\r?\n/).filter(l => l.trim());
  let nb = 0;
  let ignores = 0;
  const telsConnus = new Set(etat.membres.map(m => telephoneNormalise(m.telephone||"")).filter(Boolean));
  let code = parseInt(prochainCode(),10);
  for(const ligne of lignes){
    const c = ligne.split(/[,;\t]/).map(x => x.trim());
    if(!c[1] || /^nom$/i.test(c[1])) continue;
    const tel = telephoneNormalise(c[2]||"");
    if(tel && telsConnus.has(tel)){ ignores++; continue; }
    const corps = { code: String(code).padStart(3,"0"), nom: c[1], telephone: c[2]||"", ville: c[3]||"", cotisation: parseInt(etat.settings.cotisation||"5000",10)||5000,
      date_adhesion: /^\d{4}-\d{2}-\d{2}$/.test(c[4]||"") ? c[4] : (/^\d{2}\/\d{2}\/\d{4}$/.test(c[4]||"") ? c[4].split("/").reverse().join("-") : aujourdhui()) };
    if(c[0] && matriculeNormaliser(c[0])) corps.matricule = matriculeNormaliser(c[0]);
    else if(c[0] && /^\d{1,3}$/.test(c[0])) corps.code = c[0].padStart(3,"0");
    try{
      await sb("cc_membres", { method:"POST", headers:{ "Prefer":"return=minimal" }, body: JSON.stringify(corps) });
      nb++; code++; if(tel) telsConnus.add(tel);
    }catch(e){ ignores++; }
  }
  await chargerDonnees(); toast(nb+" membre(s) importé(s)"+(ignores ? ", "+ignores+" ignoré(s) (doublon ou matricule déjà pris)" : "")+".", "ok"); rendu();
}

async function importerPaiements(){
  const lignes = ($("#csvPaies").value||"").split(/\r?\n/).filter(l => l.trim());
  if(!lignes.length){ toast("Collez d'abord le relevé.", "err"); return; }
  let nbAuto = 0, nbManuel = 0, corps = [];
  for(const ligne of lignes){
    const c = ligne.split(/[,;\t]/).map(x => x.trim());
    if(c.length < 2) continue;
    let date = c[0]||aujourdhui();
    const dm = /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(date);
    if(dm) date = dm[3]+"-"+dm[2].padStart(2,"0")+"-"+dm[1].padStart(2,"0");
    const montant = parseInt((c[1]||"").replace(/\D/g,""),10)||0;
    if(!montant) continue;
    const p = { date, montant, canal: "Import relevé", expediteur: c[2]||"", telephone: c[3]||"", libelle: c[4]||"" };
    rapprocherPaiement(p, etat.membres, moisCourant());
    if(p.membre_id) nbAuto++; else nbManuel++;
    corps.push(p);
  }
  if(!corps.length){ toast("Aucun paiement valide trouvé.", "err"); return; }
  try{
    await sb("cc_paiements", { method:"POST", headers:{ "Prefer":"return=minimal" }, body: JSON.stringify(corps) });
    await chargerDonnees();
    toast("Import : "+nbAuto+" pointé(s) automatiquement, "+nbManuel+" à pointer.", "ok");
    rendu();
  }catch(e){ toast("Import refusé : "+e.message, "err"); }
}

/* --------------------------- Solde --------------------------- */
function tableauSolde(per){
  const lignes = []; let cumul = 0;
  // solde reporté = tout ce qui précède la période
  const avantR = sommeNet(etat.paiements.filter(p => String(p.date||"").slice(0,7) < per.debut));
  const avantD = (etat.depenses||[]).filter(d => String(d.date||"").slice(0,7) < per.debut).reduce((s,d)=>s+parseInt(d.montant,10),0);
  cumul = avantR - avantD;
  const report = cumul;
  for(const mois of listeMois(per)){
    const lm = etat.paiements.filter(p => String(p.date||"").slice(0,7) === mois);
    const r = sommeNet(lm), brut = lm.reduce((s,p)=>s+parseInt(p.montant,10),0);
    const d = (etat.depenses||[]).filter(x => String(x.date||"").slice(0,7) === mois).reduce((s,x)=>s+parseInt(x.montant,10),0);
    cumul += r - d;
    lignes.push({ mois, recettes:r, brut, frais: brut - r, depenses:d, net:r-d, cumul });
  }
  const recettes = lignes.reduce((s,l)=>s+l.recettes,0), depenses = lignes.reduce((s,l)=>s+l.depenses,0);
  return { lignes, report, recettes, depenses, net: recettes-depenses, final: cumul };
}
function vueSolde(){
  const per = periodeDepuisParams(etat.params);
  const t = tableauSolde(per);
  const coul = v => 'style="color:'+(v>=0?'var(--vert)':'#b3261e')+'"';
  return '<main>'
    + barrePeriode("solde", per, "Solde de caisse")
    + '<div class="grille g4">'
    + kpi("Solde reporté", fcfa(t.report)+" F", "avant "+libelleMois(per.debut))
    + kpi("Recettes nettes de la période", fcfa(t.recettes)+" F", "cotisations encaissées, après "+fcfa(t.lignes.reduce((s,l)=>s+l.frais,0))+" F de frais de plateforme (hors frais d’inscription)")
    + kpi("Dépenses de la période", fcfa(t.depenses)+" F", '<a href="#/depenses'+(per.mode==="tout"?"":per.mode==="mois"?"?mois="+per.debut:"?debut="+per.debut+"&fin="+per.fin)+'">détail</a>')
    + '<div class="kpi" style="border:2px solid var(--or)"><div class="t">Solde en caisse</div><div class="v" '+coul(t.final)+'>'+fcfa(t.final)+' F</div><div class="mut">au '+libelleMois(per.fin)+'</div></div>'
    + '</div>'
    + '<div class="carte" style="margin-top:14px"><div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"><h3 style="margin:0">Évolution mois par mois</h3><span style="flex:1"></span>'
    + '<button class="btn sm sec" onclick="exportSoldeCSV()">Télécharger CSV (Excel)</button>'
    + '<button class="btn sm" onclick="imprimerSolde()">Imprimer / PDF</button></div>'
    + '<div class="survol" style="margin-top:8px"><table><tr><th>Mois</th><th>Recettes nettes</th><th>Dépenses</th><th>Résultat du mois</th><th>Solde cumulé</th></tr>'
    + '<tr><td class="mut">Report</td><td></td><td></td><td></td><td>'+fcfa(t.report)+' F</td></tr>'
    + t.lignes.map(l => '<tr><td>'+libelleMois(l.mois)+'</td><td>'+fcfa(l.recettes)+' F'+(l.frais ? '<div class="mut">'+fcfa(l.brut)+' payés − '+fcfa(l.frais)+' frais</div>' : '')+'</td><td>'+fcfa(l.depenses)+' F</td><td '+coul(l.net)+'>'+(l.net<0?'− ':'')+fcfa(Math.abs(l.net))+' F</td><td><strong>'+fcfa(l.cumul)+' F</strong></td></tr>').join("")
    + '<tr><td><strong>Total période</strong></td><td><strong>'+fcfa(t.recettes)+' F</strong></td><td><strong>'+fcfa(t.depenses)+' F</strong></td><td '+coul(t.net)+'><strong>'+(t.net<0?'− ':'')+fcfa(Math.abs(t.net))+' F</strong></td><td><strong>'+fcfa(t.final)+' F</strong></td></tr>'
    + '</table></div>'
    + '<p class="mut" style="margin-top:8px">Recettes = montants <strong>nets</strong> réellement reçus (montant payé − commission Chariow / CinetPay), à leur date d’encaissement. Hors frais d’inscription (<a href="#/inscriptions">caisse séparée</a>). Les cotisations dues mais non payées sont dans le <a href="#/">tableau de bord</a> (à relancer).</p>'
    + '</div></main>';
}
function exportSoldeCSV(){
  const per = periodeDepuisParams(etat.params); const t = tableauSolde(per);
  telechargerCSV("solde_"+per.debut+"_"+per.fin+".csv", ["Mois","Payé par les membres","Frais plateforme","Recettes nettes","Dépenses","Résultat","Solde cumulé"],
    [["Report", "", "", "", "", "", t.report], ...t.lignes.map(l => [l.mois, l.brut, l.frais, l.recettes, l.depenses, l.net, l.cumul]), ["Total", t.lignes.reduce((x,l)=>x+l.brut,0), t.lignes.reduce((x,l)=>x+l.frais,0), t.recettes, t.depenses, t.net, t.final]]);

    + '<tfoot><tr><td>Total</td><td class="n">'+fcfa(t.recettes)+' F</td><td class="n">'+fcfa(t.depenses)+' F</td><td class="n">'+fcfa(t.net)+' F</td><td class="n">'+fcfa(t.final)+' F</td></tr></tfoot></table>');

async function enregistrerClesCinetPay(){
  const api = $("#k_api").value.trim(), site = $("#k_site").value.trim();
  if(!api || !site){ toast("API Key et Site ID obligatoires (ou SIMULATION / 0 pour tester).", "err"); return; }
  try{
    for(const [cle, valeur] of [["cinetpay_api_key", api],["cinetpay_site_id", site]])
      await sb("cc_secrets", { method:"POST", headers:{ "Prefer":"resolution=merge-duplicates" }, body: JSON.stringify({ cle, valeur }) });
    toast("Clés CinetPay enregistrées (table privée).", "ok"); $("#k_api").value = ""; etatCles();
  }catch(e){ toast("Refusé : "+e.message+(/cc_secrets/.test(e.message)?" — exécutez supabase/tresorerie.sql dans Supabase.":""), "err"); }
}
async function purgerSimulation(){
  const sim = etat.paiements.filter(p => /SIMULATION/.test(p.canal||""));
  if(!sim.length){ toast("Aucun paiement de simulation.", "ok"); return; }
  if(!confirm("Supprimer "+sim.length+" paiement(s) de simulation ? Les membres activés par ces tests redeviendront « en attente » s’ils n’ont aucun autre paiement.")) return;
  try{
    for(const p of sim){
      await sb("cc_paiements?id=eq."+p.id, { method:"DELETE" });
      const autres = etat.paiements.some(x => x.id !== p.id && String(x.membre_id) === String(p.membre_id) && !/SIMULATION/.test(x.canal||""));
      const m = etat.membres.find(x => String(x.id) === String(p.membre_id));
      if(m && !autres && m.date_adhesion >= "2026-10-29") await sb("cc_membres?id=eq."+m.id, { method:"PATCH", headers:{ "Prefer":"return=minimal" }, body: JSON.stringify({ actif:false }) });
    }
    await chargerDonnees(); toast("Paiements de simulation supprimés.", "ok"); rendu();
  }catch(e){ toast("Erreur : "+e.message, "err"); }
}
async function etatCles(){
  const z = $("#k_etat"); if(!z) return;
  try{ const r = await sb("cc_secrets?select=cle,maj_le"); const ok = r.some(x => x.cle === "cinetpay_api_key");
    z.textContent = ok ? "✔ Clés CinetPay présentes (mises à jour le "+fdateFR(String((r.find(x=>x.cle==="cinetpay_api_key")||{}).maj_le||""))+")." : "Aucune clé enregistrée pour l’instant."; }
  catch(e){ z.textContent = ""; }
}
async function enregistrerParametres(){
  const cles = ["reseau","slogan","cotisation","jour_echeance","tresorier","tresorier_tel",
    "contact_email","site_web","adhesion","whatsapp_lien","skool_lien","bienvenue","matricule_depart","matricule_auto","debut_cotisations","charte_lien","replay_lien","fondateur","cinetpay_commission"];
  if($("#s_matricule_auto").value === "oui" && !(parseInt($("#s_matricule_depart").value,10) > 0)){ toast("Indiquez d’abord le dernier n° de carte imprimé pour activer l’attribution automatique.", "err"); return; }
  try{
    for(const cle of cles){

      await sb("cc_settings", { method:"POST",
        headers:{ "Prefer":"resolution=merge-duplicates" },
        body: JSON.stringify({ cle, valeur }) });

    await chargerDonnees(); toast("Paramètres enregistrés.", "ok"); rendu();
  }catch(e){ toast("Enregistrement refusé : "+e.message, "err"); }
}

/* --------------------------- Appels à paiement (trésorier) --------------------------- */
function vueAppels(params){
  const icone = { formation:"🎓", document:"📄", carte:"🪪", vitrine:"🏪", autre:"💳" };
  const suivi = a => {
    const parM = {}; for(const p of etat.paiements) if(String(p.appel_id) === String(a.id)) parM[p.membre_id] = (parM[p.membre_id]||0) + parseInt(p.montant,10);
    const payes = Object.keys(parM).filter(id => parM[id] >= parseInt(a.montant,10)).length;
    const total = Object.values(parM).reduce((s,v)=>s+v,0);
    return { parM, payes, total };
  };
  const actifs = etat.membres.filter(m => m.actif);
  let detail = "";
  if(params.id){
    const a = etat.appels.find(x => String(x.id) === String(params.id));
    if(a){
      const sv = suivi(a);
      const lignes = actifs.map(m => ({ m, paye: sv.parM[m.id]||0 })).sort((x,y) => (y.paye - x.paye) || x.m.nom.localeCompare(y.m.nom));
      const texte = m => encodeURIComponent("Bonjour "+m.nom.split(" ")[0]+", le réseau "+(etat.settings.reseau||"ComptaConnect")+" vous invite à régler « "+a.titre+" » ("+fcfa(a.montant)+" FCFA"+(a.date_limite ? ", avant le "+dateFR(a.date_limite) : "")+"). Payez ici : "+lienMembreAbsolu(m, "&appel="+a.id)+" — Merci !");
      detail = '<div class="carte" style="border:2px solid var(--or)"><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><h3 style="margin:0">Suivi — '+ech(a.titre)+'</h3><span style="flex:1"></span>'
        + '<button class="btn sm sec" onclick="exportAppelCSV('+a.id+')">Télécharger CSV</button><a class="btn sm sec" href="#/appels">Fermer</a></div>'
        + '<div class="grille g3" style="margin:10px 0">'+kpi("Ont payé", sv.payes+" / "+actifs.length, Math.round(100*sv.payes/Math.max(1,actifs.length))+" %")+kpi("Encaissé", fcfa(sv.total)+" F", "")+kpi("Reste attendu", fcfa(Math.max(0, actifs.length*parseInt(a.montant,10) - sv.total))+" F", "si tous paient")+'</div>'
        + '<div class="survol"><table><tr><th>Matricule</th><th>Nom</th><th>Téléphone</th><th>Payé</th><th></th></tr>'
        + lignes.map(({m, paye}) => '<tr><td><span class="matricule">'+ech(m.matricule||m.code)+'</span></td><td>'+ech(m.nom)+'</td><td>'+ech(m.telephone||"")+'</td>'
          + '<td>'+(paye >= parseInt(a.montant,10) ? '<span class="badge b-paye">'+fcfa(paye)+' F</span>' : paye > 0 ? '<span class="badge b-partiel">'+fcfa(paye)+' F</span>' : '<span class="badge b-impaye">—</span>')+'</td>'
          + '<td>'+(paye < parseInt(a.montant,10) && m.telephone ? '<a class="btn sm sec" href="https://wa.me/'+ech(String(m.telephone).replace(/\D/g,""))+'?text='+texte(m)+'" target="_blank" rel="noopener">Relancer</a>' : '')+'</td></tr>').join("")
        + '</table></div></div>';
    }
  }
  const lienPublic = a => location.origin + location.pathname + "#/appel?id=" + a.id;
  return '<main><div class="carte"><h3>Appels à paiement</h3>'
    + '<p class="mut">Formation, document, carte de membre, cotisation exceptionnelle… Créez l’appel, puis partagez son <strong>lien</strong> sur le groupe WhatsApp : chaque membre entre son matricule et paie en ligne. Le suivi est automatique et séparé des cotisations mensuelles.</p>'
    + '<div id="editeurAppel"></div>'
    + '<button class="btn" onclick="editerAppel(0)">+ Nouvel appel à paiement</button></div>'
    + detail
    + (etat.appels.length ? '<div class="carte"><div class="survol"><table><tr><th></th><th>Titre</th><th>Montant</th><th>Date limite</th><th>Ont payé</th><th>Encaissé</th><th>Statut</th><th></th></tr>'
      + etat.appels.map(a => { const sv = suivi(a); return '<tr><td style="font-size:20px">'+(icone[a.type]||"💳")+'</td><td><strong>'+ech(a.titre)+'</strong>'+(a.description ? '<div class="mut">'+ech(a.description).slice(0,80)+'</div>' : '')+'</td>'
        + '<td>'+fcfa(a.montant)+' F</td><td>'+(a.date_limite ? dateFR(a.date_limite) : '—')+'</td><td>'+sv.payes+' / '+actifs.length+'</td><td>'+fcfa(sv.total)+' F</td>'
        + '<td>'+(a.ouvert ? '<span class="badge b-paye">ouvert</span>' : '<span class="badge b-neutre">clôturé</span>')+'</td>'
        + '<td style="white-space:nowrap"><a class="btn sm" href="#/appels?id='+a.id+'">Suivi</a> '
        + '<button class="btn sm sec" onclick="copier(\''+lienPublic(a)+'\')" title="'+lienPublic(a)+'">Copier le lien</button> '
        + '<a class="btn sm sec" href="https://wa.me/?text='+encodeURIComponent("📢 "+(etat.settings.reseau||"ComptaConnect")+" — "+a.titre+" : "+fcfa(a.montant)+" FCFA"+(a.date_limite ? " avant le "+dateFR(a.date_limite) : "")+". Payez en ligne avec votre matricule : "+lienPublic(a))+'" target="_blank" rel="noopener">WhatsApp</a> '
        + '<button class="btn sm sec" onclick="editerAppel('+a.id+')">Modifier</button> '
        + '<button class="btn sm '+(a.ouvert ? 'dgr' : 'sec')+'" onclick="basculerAppel('+a.id+','+(!a.ouvert)+')">'+(a.ouvert ? 'Clôturer' : 'Rouvrir')+'</button>'
        + (sv.total === 0 ? ' <button class="btn sm dgr" onclick="supprimerAppel('+a.id+')" title="Possible tant que personne n’a payé">✕</button>' : '')+'</td></tr>'; }).join("")
      + '</table></div></div>' : '<div class="carte mut">Aucun appel à paiement pour l’instant.</div>')
    + '</main>';
}
function copier(texte){ (navigator.clipboard ? navigator.clipboard.writeText(texte) : Promise.reject()).then(() => toast("Lien copié : "+texte, "ok"), () => prompt("Copiez ce lien :", texte)); }

async function enregistrerAppel(id){
  const v = k => ($("#ap_"+k).value||"").trim();
  const corps = { titre: v("titre"), type: v("type"), description: v("description"), montant: parseInt(v("montant").replace(/\D/g,""),10)||0,
    date_limite: v("date_limite") || null, lien_apres: v("lien_apres"),
    vitrine_id: v("vitrine") ? parseInt(v("vitrine"),10) : null, duree_mois: parseInt(v("duree_mois"),10) || 0 };
  if(!corps.titre || corps.montant <= 0){ toast("Titre et montant obligatoires.", "err"); return; }
  try{
    if(id) await sb("cc_appels?id=eq."+id, { method:"PATCH", headers:{ "Prefer":"return=minimal" }, body: JSON.stringify(corps) });
    else await sb("cc_appels", { method:"POST", headers:{ "Prefer":"return=minimal" }, body: JSON.stringify(Object.assign({ ouvert:true }, corps)) });
    await chargerDonnees(); rendu(); toast(id ? "Appel modifié." : "Appel créé — partagez son lien sur le groupe.", "ok");
  }catch(e){ toast("Refusé : "+e.message+(/cc_appels/.test(e.message) ? " — exécutez supabase/reseau.sql dans Supabase." : ""), "err"); }
}
async function basculerAppel(id, ouvert){
  try{ await sb("cc_appels?id=eq."+id, { method:"PATCH", headers:{ "Prefer":"return=minimal" }, body: JSON.stringify({ ouvert }) });
    await chargerDonnees(); rendu(); toast(ouvert ? "Appel rouvert." : "Appel clôturé : plus aucun paiement possible.", "ok"); }catch(e){ toast(e.message, "err"); }
}
async function supprimerAppel(id){
  const a = etat.appels.find(x => String(x.id) === String(id)); if(!a) return;
  if(etat.paiements.some(p => String(p.appel_id) === String(id))){ toast("Des membres ont déjà payé : clôturez l’appel au lieu de le supprimer.", "err"); return; }
  if(!confirm("Supprimer définitivement « "+a.titre+" » ? (aucun paiement enregistré)")) return;
  try{ await sb("cc_appels?id=eq."+id, { method:"DELETE" }); await chargerDonnees(); rendu(); toast("Appel supprimé.", "ok"); }catch(e){ toast(e.message, "err"); }
}
function exportAppelCSV(id){
  const a = etat.appels.find(x => String(x.id) === String(id)); if(!a) return;
  const parM = {}; for(const p of etat.paiements) if(String(p.appel_id) === String(a.id)) parM[p.membre_id] = (parM[p.membre_id]||0) + parseInt(p.montant,10);
  telechargerCSV("appel_"+a.id+".csv", ["Matricule","Nom","Téléphone","Payé (FCFA)","Statut"],
    etat.membres.filter(m => m.actif).map(m => [m.matricule||m.code, m.nom, m.telephone||"", parM[m.id]||0, (parM[m.id]||0) >= parseInt(a.montant,10) ? "payé" : (parM[m.id] ? "partiel" : "non payé")]));
}

/* Accès à l'espace trésorier : qui peut modifier (trésorier) et qui consulte seulement (fondateur / bureau) */
/* Accès à l'espace trésorier : comptes (e-mail + mot de passe) et rôles, gérés depuis Paramètres par le trésorier.
   La création / le mot de passe / la suppression passent par la fonction serveur « acces » (clé service côté serveur,
   jamais dans le navigateur) ; elle vérifie que l'appelant est bien trésorier. */
function carteAcces(){
  const lecture = etat.session && etat.session.role === "fondateur";
  setTimeout(chargerComptes, 0);
  return '<div class="carte"><h3>Accès à l’espace trésorier</h3>'

function motDePasseAleatoire(){ const a = "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghjkmnpqrstuvwxyz23456789"; let m = "CC-"; for(let i=0;i<9;i++) m += a[Math.floor(Math.random()*a.length)]; return m; }
async function appelAcces(corps){
  if(etat.session && etat.session.expire && Date.now() > etat.session.expire - 60000) await rafraichirSession();
  const rep = await fetch(etat.cfg.url.replace(/\/$/,"") + "/functions/v1/acces", { method:"POST",
    headers:{ "apikey": etat.cfg.anon, "Authorization": "Bearer " + etat.session.token, "Content-Type":"application/json" }, body: JSON.stringify(corps) });
  const j = await rep.json().catch(() => ({}));
  if(!rep.ok) throw new Error(j.erreur || ("Erreur " + rep.status));
  return j;
}
