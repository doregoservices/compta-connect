  return '<div class="carte"'+(v.en_avant ? ' style="border:2px solid var(--or)"' : '')+'>'
    + '<div style="display:flex;gap:12px;align-items:center">'+(v.logo_url ? '<img class="avatar xl" src="'+ech(v.logo_url)+'" alt="" style="border-radius:14px">' : '<span class="avatar xl" style="border-radius:14px">🏪</span>')
    + '<div style="flex:1;min-width:0"><h3 style="margin:0">'+ech(v.nom)+'</h3><div class="mut">'+ech([v.categorie, v.proprietaire].filter(Boolean).join(" · "))+'</div>'+(v.en_avant ? '<span class="badge b-avance">à la une</span>' : '')+'</div></div>'
    + (v.description ? '<p style="white-space:pre-line">'+ech(complet ? v.description : (v.description.length > 160 ? v.description.slice(0,160)+"…" : v.description))+'</p>' : '')
    + (prods.length ? '<div class="survol"><table>'+prods.slice(0, complet ? 50 : 4).map(p => '<tr><td>'+ech(p.nom)+'</td><td style="text-align:right;white-space:nowrap"><strong>'+(p.prix ? fcfa(p.prix)+' F' : 'sur devis')+'</strong></td></tr>').join("")+'</table></div>' : '')
    + (complet && (v.photos||[]).length ? '<div class="galerie" style="margin-top:8px">'+(v.photos||[]).map(u => '<a href="'+ech(u)+'" target="_blank" rel="noopener"><img src="'+ech(u)+'" alt="" loading="lazy"></a>').join("")+'</div>' : '')
    + '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px">'
    + (wa ? '<a class="btn" style="background:#25D366" href="https://wa.me/'+wa+'?text='+encodeURIComponent("Bonjour, je vous contacte depuis le Marché "+(etat.settings.reseau||"ComptaConnect")+" au sujet de « "+v.nom+" ».")+'" target="_blank" rel="noopener">Contacter sur WhatsApp</a>' : '')
    + (!complet ? '<a class="btn sec" href="#/marche?id='+v.id+'">Voir la vitrine</a>' : '')+'</div>'
    + '<p class="mut" style="margin:8px 0 0;font-size:11.5px">La vente se fait directement entre vous et le vendeur ; le réseau n’intervient pas dans la transaction.</p></div>';
}
function sectionVitrines(){
  const l = vitrinesActives(); if(!l.length) return "";
  const avant = l.filter(v => v.en_avant).concat(l.filter(v => !v.en_avant)).slice(0, 3);
  return '<div class="carte"><div style="display:flex;align-items:center;gap:10px"><h3 style="margin:0">🏪 Le Marché du réseau</h3><span style="flex:1"></span><a href="#/marche">Toutes les vitrines ('+l.length+')</a></div>'
    + '<div class="bureau" style="margin-top:8px">'+avant.map(v => '<a class="p" href="#/marche?id='+v.id+'" style="text-decoration:none;color:inherit">'+(v.logo_url ? '<img class="avatar xl" src="'+ech(v.logo_url)+'" alt="" style="border-radius:14px">' : '<span class="avatar xl" style="border-radius:14px">🏪</span>')+'<div class="nm">'+ech(v.nom)+'</div><div class="ps">'+ech(v.categorie||"")+'</div></a>').join("")+'</div>'
    + '<p class="mut" style="margin-top:10px">Vous voulez votre vitrine ici ? Contactez le trésorier : <a href="tel:'+ech(etat.settings.tresorier_tel||"")+'">'+ech(etat.settings.tresorier_tel||"")+'</a></p></div>';
}
function vueMarche(params){
  const l = vitrinesActives();
  if(params.id){ const v = l.find(x => String(x.id) === String(params.id)); if(!v) return '<main><div class="alerte al-err">Cette vitrine n’est pas disponible.</div></main>';
    return '<main style="max-width:680px"><p><a href="#/marche">← Le Marché</a></p>'+carteVitrine(v, true)+'</main>'; }
  return '<main><div class="carte"><h3>🏪 Le Marché du réseau</h3><p class="mut">Produits et services proposés par les membres et partenaires de '+ech(etat.settings.reseau||"ComptaConnect")+'. '
    + 'Pour louer une vitrine, contactez le trésorier : <a href="tel:'+ech(etat.settings.tresorier_tel||"")+'">'+ech(etat.settings.tresorier_tel||"")+'</a>.</p></div>'
    + (l.length ? l.map(v => carteVitrine(v, false)).join("") : '<div class="carte mut">Aucune vitrine pour le moment.</div>') + '</main>';
}
function vueMarcheAdmin(params){
  const loyer = parseInt(etat.settings.vitrine_loyer||"5000",10);
  return '<main><div class="carte"><h3>🏪 Marché — vitrines louées</h3>'
    + '<p class="mut">Un membre ou un partenaire loue une vitrine (logo, description, produits, bouton WhatsApp). Le réseau encaisse le loyer ; la vente se fait hors plateforme, sans argent de tiers ni litige à gérer. '
    + 'La vitrine est visible tant que la date de fin de location n’est pas dépassée. Deux façons d’encaisser : <strong>un appel à paiement</strong> de type « Loyer de vitrine » (le paiement en ligne prolonge la vitrine automatiquement), ou <strong>Prolonger</strong> ci-dessous après un paiement reçu directement (inscrit en recette).</p>'
    + '<div class="grille g2"><div class="champ"><span>Loyer mensuel conseillé (FCFA)</span><input id="s_vitrine_loyer" type="number" value="'+loyer+'"></div><div class="champ"><span>&nbsp;</span><button class="btn sec" onclick="enregistrerSetting(\'vitrine_loyer\', document.querySelector(\'#s_vitrine_loyer\').value)">Enregistrer</button></div></div>'
    + '<div id="editeurVitrine"></div><button class="btn" onclick="editerVitrine(0)">+ Nouvelle vitrine</button></div>'
    + (etat.vitrines.length ? '<div class="carte"><div class="survol"><table><tr><th></th><th>Vitrine</th><th>Vendeur</th><th>Fin de location</th><th>Statut</th><th></th></tr>'
      + etat.vitrines.map(v => '<tr><td>'+(v.logo_url ? '<img class="avatar" src="'+ech(v.logo_url)+'" alt="" style="border-radius:10px">' : '<span class="avatar" style="border-radius:10px">🏪</span>')+'</td><td><strong>'+ech(v.nom)+'</strong>'+(v.en_avant ? ' ⭐' : '')+'<div class="mut">'+ech(v.categorie||"")+' · '+(Array.isArray(v.produits)?v.produits.length:0)+' produit(s) · '+(v.photos||[]).length+' photo(s)</div></td>'
        + '<td>'+ech(v.proprietaire||"")+'<div class="mut">'+ech(v.telephone||"")+'</div></td><td>'+(v.fin_location ? dateFR(v.fin_location) : '<span class="mut">illimitée</span>')+'</td>'
        + '<td>'+(vitrineActive(v) ? '<span class="badge b-paye">visible</span>' : (v.publie === false ? '<span class="badge b-neutre">masquée</span>' : '<span class="badge b-impaye">location expirée</span>'))+'</td>'
        + '<td style="white-space:nowrap"><button class="btn sm" onclick="prolongerVitrine('+v.id+')">Prolonger</button> <button class="btn sm sec" onclick="logoVitrine('+v.id+')">Logo</button> <button class="btn sm sec" onclick="photosVitrine('+v.id+')">📷</button> '
        + '<button class="btn sm sec" onclick="copier(\''+location.origin+location.pathname+'#/marche?id='+v.id+'\')">Lien</button> <button class="btn sm sec" onclick="editerVitrine('+v.id+')">Modifier</button> <button class="btn sm dgr" onclick="supprimerVitrine('+v.id+')">✕</button></td></tr>').join("")
      + '</table></div></div>' : '')
    + '</main>';
}
function editerVitrine(id){
  const v = etat.vitrines.find(x => String(x.id) === String(id)) || { nom:"", proprietaire:"", membre_id:null, telephone:"", categorie:"", description:"", produits:[], loyer_mensuel: parseInt(etat.settings.vitrine_loyer||"5000",10), fin_location:"", en_avant:false, publie:true };
  const champ = (k, label, val, type, ph) => '<div class="champ"><span>'+label+'</span><input id="vi_'+k+'" type="'+(type||"text")+'" value="'+ech(val==null?"":val)+'" placeholder="'+(ph||"")+'"></div>';
  const prods = (Array.isArray(v.produits) ? v.produits : []).map(p => p.nom + (p.prix ? " ; " + p.prix : "")).join("\n");
  $("#editeurVitrine").innerHTML = '<div style="border:1px solid var(--ligne);border-radius:12px;padding:12px;margin:10px 0"><div class="grille g2">'
    + champ("nom","Nom de la vitrine",v.nom,"text","Cabinet XY — Formations Excel")
    + '<div class="champ"><span>Membre du réseau (facultatif)</span><select id="vi_membre" onchange="(function(s){const m=etat.membres.find(x=>String(x.id)===s.value);if(m){document.querySelector(\'#vi_proprietaire\').value=m.nom;document.querySelector(\'#vi_telephone\').value=m.telephone||\'\';}})(this)"><option value="">— externe —</option>'+etat.membres.map(m => '<option value="'+m.id+'"'+(String(v.membre_id)===String(m.id)?' selected':'')+'>'+ech(m.nom)+'</option>').join("")+'</select></div>'
    + champ("proprietaire","Vendeur (nom affiché)",v.proprietaire) + champ("telephone","WhatsApp du vendeur",v.telephone,"tel","07 00 00 00 00")
    + champ("categorie","Catégorie",v.categorie,"text","Formation, Logiciel, Papeterie…") + champ("loyer_mensuel","Loyer mensuel (FCFA)",v.loyer_mensuel,"number")
    + champ("fin_location","Fin de location (vide = illimitée)",v.fin_location||"","date")
    + '<div class="champ"><span>Mise en avant</span><select id="vi_en_avant"><option value="false"'+(!v.en_avant?' selected':'')+'>Normale</option><option value="true"'+(v.en_avant?' selected':'')+'>À la une (accueil)</option></select></div>'
    + '<div class="champ"><span>Publication</span><select id="vi_publie"><option value="true"'+(v.publie!==false?' selected':'')+'>Visible</option><option value="false"'+(v.publie===false?' selected':'')+'>Masquée</option></select></div>'
    + '<div class="champ" style="grid-column:1/-1"><span>Description</span><textarea id="vi_description" style="min-height:70px">'+ech(v.description||"")+'</textarea></div>'
    + '<div class="champ" style="grid-column:1/-1"><span>Produits / services — un par ligne : <code>nom ; prix</code> (prix facultatif)</span><textarea id="vi_produits" style="min-height:90px" placeholder="Formation Excel avancé ; 25000&#10;Audit de conformité fiscale">'+ech(prods)+'</textarea></div>'
    + '</div><div style="display:flex;gap:8px"><button class="btn" onclick="enregistrerVitrine('+(id||0)+')">Enregistrer</button><button class="btn sec" onclick="document.querySelector(\'#editeurVitrine\').innerHTML=\'\'">Annuler</button></div></div>';
}
async function enregistrerVitrine(id){
  const v = k => ($("#vi_"+k).value||"").trim();
  const produits = v("produits").split(/\r?\n/).map(l => l.trim()).filter(Boolean).map(l => { const [nom, prix] = l.split(/\s*;\s*/); return { nom: nom.trim(), prix: parseInt(String(prix||"").replace(/\D/g,""),10) || 0 }; });
  const corps = { nom: v("nom"), proprietaire: v("proprietaire"), membre_id: v("membre") ? parseInt(v("membre"),10) : null, telephone: v("telephone"), categorie: v("categorie"),
    description: v("description"), produits, loyer_mensuel: parseInt(v("loyer_mensuel"),10) || 0, fin_location: v("fin_location") || null,
    en_avant: $("#vi_en_avant").value === "true", publie: $("#vi_publie").value === "true" };
  if(!corps.nom){ toast("Le nom de la vitrine est obligatoire.", "err"); return; }
  try{
    if(id) await sb("cc_vitrines?id=eq."+id, { method:"PATCH", headers:{ "Prefer":"return=minimal" }, body: JSON.stringify(corps) });
    else await sb("cc_vitrines", { method:"POST", headers:{ "Prefer":"return=minimal" }, body: JSON.stringify(corps) });
    await chargerDonnees(); rendu(); toast("Vitrine enregistrée.", "ok");
  }catch(e){ toast("Refusé : "+e.message+(/cc_vitrines/.test(e.message) ? " — exécutez supabase/reseau.sql dans Supabase." : ""), "err"); }
}
async function prolongerVitrine(id){
  const v = etat.vitrines.find(x => String(x.id) === String(id)); if(!v) return;
  const mois = parseInt(prompt("Prolonger « "+v.nom+" » de combien de mois ? (paiement reçu directement)", "1")||"0",10); if(!(mois > 0)) return;
  const montant = parseInt(prompt("Montant encaissé (FCFA) — inscrit en recette « Location vitrine » :", String((v.loyer_mensuel||0) * mois))||"0",10);
  const base = (v.fin_location && String(v.fin_location) >= aujourdhui()) ? new Date(v.fin_location) : new Date();
  base.setMonth(base.getMonth() + mois); const fin = base.toISOString().slice(0,10);
  try{
    await sb("cc_vitrines?id=eq."+id, { method:"PATCH", headers:{ "Prefer":"return=minimal" }, body: JSON.stringify({ fin_location: fin, publie: true }) });
    if(montant > 0) await sb("cc_paiements", { method:"POST", headers:{ "Prefer":"return=minimal" }, body: JSON.stringify({ date: aujourdhui(), montant, canal: "Location vitrine", expediteur: v.proprietaire || v.nom,
      telephone: v.telephone || "", libelle: "Location vitrine « "+v.nom+" » — "+mois+" mois", mois: "", membre_id: v.membre_id || null, statut: "RAPPROCHE", methode: "manuel" }) });
    await chargerDonnees(); rendu(); toast("Vitrine prolongée jusqu’au "+dateFR(fin)+(montant > 0 ? " · "+fcfa(montant)+" F en recette." : "."), "ok");
  }catch(e){ toast("Refusé : "+e.message, "err"); }
}
async function logoVitrine(id){
  const [f] = await choisirImage(false); if(!f) return;
  try{ const url = await televerserPhoto("vitrines/" + id + "/logo.jpg", await compresserImage(f, 400));
    await sb("cc_vitrines?id=eq."+id, { method:"PATCH", headers:{ "Prefer":"return=minimal" }, body: JSON.stringify({ logo_url: url }) });
    await chargerDonnees(); rendu(); toast("Logo enregistré.", "ok"); }catch(e){ toast("Logo refusé : "+e.message, "err"); }
}
async function photosVitrine(id){
  const v = etat.vitrines.find(x => String(x.id) === String(id)); if(!v) return;
  const fichiers = await choisirImage(true); if(!fichiers.length) return;
  const photos = (v.photos||[]).slice();
  try{
    for(let i = 0; i < fichiers.length && photos.length < 6; i++) photos.push(await televerserPhoto("vitrines/" + id + "/" + Date.now() + "_" + i + ".jpg", await compresserImage(fichiers[i], 1000, 0.8)));
    await sb("cc_vitrines?id=eq."+id, { method:"PATCH", headers:{ "Prefer":"return=minimal" }, body: JSON.stringify({ photos }) });
    await chargerDonnees(); rendu(); toast("Photos ajoutées (6 maximum par vitrine).", "ok");
  }catch(e){ toast("Envoi interrompu : "+e.message, "err"); }
}
async function supprimerVitrine(id){
  if(!confirm("Supprimer cette vitrine ? (les loyers déjà encaissés restent dans la caisse)")) return;
  try{ await sb("cc_vitrines?id=eq."+id, { method:"DELETE" }); await chargerDonnees(); rendu(); }catch(e){ toast(e.message, "err"); }
}

/* --------------------------- Démarrage --------------------------- */
window.addEventListener("hashchange", rendu);
(async function(){
  cfgCharger(); sessionCharger();
  if(etat.cfg){
    try{ await chargerDonnees(); }
    catch(e){ console.warn("chargement:", e.message); }
  }
  rendu();
})();
</script>
