<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0A1C2D">
<title>ComptaConnect — cotisations</title>
<link rel="icon" href="logomark.png">
<style>
:root{
  --bleu:#0A1C2D; --bleu2:#16283E; --vert:#1D9E75; --vert-fonce:#085041;
  --menthe:#7DCDB0; --menthe-pale:#9FE1CB; --vert-eau:#D5E8E0;
  --or:#C9A227; --creme:#FEF5DC; --rouge:#C0392B; --fond:#F7F7F5;
  --carte:#ffffff; --ligne:#e3e8e6; --muet:#5c6b76; --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",Arial,sans-serif;
  background:var(--fond);color:var(--bleu);font-size:15px;line-height:1.5}
a{color:var(--vert-fonce)}
h1,h2,h3{margin:0 0 10px}
h2{font-size:19px}h3{font-size:16px}
.mut{color:var(--muet);font-size:13px}
.topwrap{background:linear-gradient(120deg,var(--bleu),var(--bleu2));border-bottom:3px solid var(--vert)}
.top{display:flex;align-items:center;gap:10px;padding:12px 16px;max-width:1060px;margin:0 auto}
.marque{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none}
.marque img{width:38px;height:38px;border-radius:10px}
.marque .nom{font-weight:800;font-size:17px;letter-spacing:.4px}
.marque .nom b{color:var(--menthe)}
.marque .slog{font-size:10.5px;color:#bcd6cc;display:block}
.spacer{flex:1}
.nav{display:flex;gap:6px;flex-wrap:wrap;padding:0 16px 10px;max-width:1060px;margin:0 auto}
.nav a{flex-shrink:0;text-decoration:none;color:#cfe3da;font-size:13.5px;font-weight:600;
  padding:7px 13px;border-radius:99px;background:rgba(255,255,255,.08);white-space:nowrap}
.nav a.on,.nav a:hover{background:var(--vert);color:#fff}
main{max-width:1060px;margin:0 auto;padding:16px}
.carte{background:var(--carte);border:1px solid var(--ligne);border-radius:var(--r);
  padding:16px;margin-bottom:14px;box-shadow:0 1px 3px rgba(10,28,45,.05)}
.grille{display:grid;gap:12px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:820px){.g4{grid-template-columns:1fr 1fr}}
@media(max-width:560px){.g2,.g3,.g4{grid-template-columns:1fr}}
.kpi{background:var(--carte);border:1px solid var(--ligne);border-radius:var(--r);padding:13px 14px}
.kpi .t{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.3px;color:var(--muet)}
.kpi .v{font-size:21px;font-weight:800;color:var(--vert-fonce)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;background:var(--vert);color:#fff;
  border:none;border-radius:11px;padding:10px 16px;font-size:14.5px;font-weight:700;cursor:pointer;
  text-decoration:none;font-family:inherit}
.btn:active{transform:scale(.98)}
.btn.sec{background:var(--vert-eau);color:var(--vert-fonce)}
.btn.som{background:var(--bleu)}
.btn.dgr{background:var(--rouge)}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:9px}
.btn.blk{width:100%}
.btn:disabled{opacity:.5}
.champ{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.champ span{font-size:12.5px;font-weight:700;color:var(--muet)}
input,select,textarea{font-family:inherit;font-size:15px;padding:10px 12px;border:1.5px solid var(--ligne);
  border-radius:11px;background:#fff;color:var(--bleu);width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--vert)}
textarea{min-height:110px;font-size:13.5px}
table{width:100%;border-collapse:collapse;font-size:13.8px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.3px;color:var(--muet);text-align:left;
  padding:8px 9px;border-bottom:2px solid var(--vert-eau)}
td{padding:8px 9px;border-bottom:1px solid var(--ligne);vertical-align:middle}
tr:hover td{background:#f4faf7}
.survol{overflow-x:auto}
.badge{display:inline-block;padding:3px 10px;border-radius:99px;font-size:11.5px;font-weight:800;
  text-transform:uppercase;letter-spacing:.3px}
.b-paye{background:var(--vert-eau);color:var(--vert-fonce)}
.b-partiel{background:var(--creme);color:#8a6d13}
.b-impaye{background:#fbe9e7;color:var(--rouge)}
.b-avance{background:#e3ecfa;color:#2b5fa8}
.b-neutre{background:#eef1f0;color:var(--muet)}
.alerte{border-radius:11px;padding:11px 14px;margin-bottom:12px;font-size:14px}
.al-err{background:#fbe9e7;border:1px solid #eec9c4;color:#7c2d24}
.al-ok{background:var(--vert-eau);border:1px solid #bfe0d3;color:var(--vert-fonce)}
.al-info{background:var(--creme);border:1px solid #eeddb0;color:#7a6212}
.ref{font-family:ui-monospace,Consolas,monospace;font-size:24px;font-weight:800;letter-spacing:2px;
  color:var(--vert-fonce);background:var(--vert-eau);border-radius:11px;padding:12px;text-align:center}
.qr{display:flex;flex-direction:column;align-items:center;padding:10px;background:#fff;
  border:1px solid var(--ligne);border-radius:11px;width:max-content;margin:12px auto 0}
.etape{display:flex;gap:10px;margin:8px 0}
.etape .n{flex-shrink:0;width:24px;height:24px;border-radius:99px;background:var(--vert);color:#fff;
  font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center}
.hero{background:linear-gradient(135deg,var(--bleu),var(--bleu2));border-radius:var(--r);color:#fff;
  padding:26px;text-align:center;margin-bottom:14px}
.hero img{width:96px;height:96px;border-radius:20px;margin-bottom:10px}
.hero h1{font-size:24px}.hero .b{color:var(--menthe)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--bleu);color:#fff;
  padding:11px 18px;border-radius:11px;font-weight:700;font-size:14px;opacity:0;transition:.25s;
  pointer-events:none;z-index:99;max-width:90%}
#toast.ok{background:var(--vert-fonce)}#toast.err{background:var(--rouge)}#toast.on{opacity:1}
.pied{text-align:center;color:var(--muet);font-size:12.5px;padding:14px}
</style>
</head>

<div id="app"></div>
<div id="toast"></div>
<script>
/*

 *   Software.

"use strict";
var qrcodegen;
(function (qrcodegen) {
    /*---- QR Code symbol class ----*/
    /*
     * A QR Code symbol, which is a type of two-dimension barcode.
     * Invented by Denso Wave and described in the ISO/IEC 18004 standard.
     * Instances of this class represent an immutable square grid of dark and light cells.
     * The class provides static factory functions to create a QR Code from text or binary data.
     * The class covers the QR Code Model 2 specification, supporting all versions (sizes)
     * from 1 to 40, all 4 error correction levels, and 4 character encoding modes.
     *
     * Ways to create a QR Code object:
     * - High level: Take the payload data and call QrCode.encodeText() or QrCode.encodeBinary().
     * - Mid level: Custom-make the list of segments and call QrCode.encodeSegments().
     * - Low level: Custom-make the array of data codeword bytes (including
     *   segment headers and final padding, excluding error correction codewords),
     *   supply the appropriate version number, and call the QrCode() constructor.
     * (Note that all ways require supplying the desired error correction level.)
     */
    class QrCode {
        /*-- Constructor (low level) and fields --*/
        // Creates a new QR Code with the given version number,
        // error correction level, data codeword bytes, and mask number.
        // This is a low-level API that most users should not use directly.
        // A mid-level API is the encodeSegments() function.
        constructor(
        // The version number of this QR Code, which is between 1 and 40 (inclusive).
        // This determines the size of this barcode.
        version, 
        // The error correction level used in this QR Code.
        errorCorrectionLevel, dataCodewords, msk) {
            this.version = version;
            this.errorCorrectionLevel = errorCorrectionLevel;
            // The modules of this QR Code (false = light, true = dark).
            // Immutable after constructor finishes. Accessed through getModule().
            this.modules = [];
            // Indicates function modules that are not subjected to masking. Discarded when constructor finishes.
            this.isFunction = [];
            // Check scalar arguments
            if (version < QrCode.MIN_VERSION || version > QrCode.MAX_VERSION)
                throw new RangeError("Version value out of range");
            if (msk < -1 || msk > 7)
                throw new RangeError("Mask value out of range");
            this.size = version * 4 + 17;
            // Initialize both grids to be size*size arrays of Boolean false
            let row = [];
            for (let i = 0; i < this.size; i++)
                row.push(false);
            for (let i = 0; i < this.size; i++) {
                this.modules.push(row.slice()); // Initially all light
                this.isFunction.push(row.slice());
            }
            // Compute ECC, draw modules
            this.drawFunctionPatterns();
            const allCodewords = this.addEccAndInterleave(dataCodewords);
            this.drawCodewords(allCodewords);
            // Do masking
            if (msk == -1) { // Automatically choose best mask
                let minPenalty = 1000000000;
                for (let i = 0; i < 8; i++) {
                    this.applyMask(i);
                    this.drawFormatBits(i);
                    const penalty = this.getPenaltyScore();
                    if (penalty < minPenalty) {
                        msk = i;
                        minPenalty = penalty;
                    }
                    this.applyMask(i); // Undoes the mask due to XOR
                }
            }
            assert(0 <= msk && msk <= 7);
            this.mask = msk;
            this.applyMask(msk); // Apply the final choice of mask
            this.drawFormatBits(msk); // Overwrite old format bits
            this.isFunction = [];
        }
        /*-- Static factory functions (high level) --*/
        // Returns a QR Code representing the given Unicode text string at the given error correction level.
        // As a conservative upper bound, this function is guaranteed to succeed for strings that have 738 or fewer
        // Unicode code points (not UTF-16 code units) if the low error correction level is used. The smallest possible
        // QR Code version is automatically chosen for the output. The ECC level of the result may be higher than the
        // ecl argument if it can be done without increasing the version.
        static encodeText(text, ecl) {
            const segs = qrcodegen.QrSegment.makeSegments(text);
            return QrCode.encodeSegments(segs, ecl);
        }
        // Returns a QR Code representing the given binary data at the given error correction level.
        // This function always encodes using the binary segment mode, not any text mode. The maximum number of
        // bytes allowed is 2953. The smallest possible QR Code version is automatically chosen for the output.
        // The ECC level of the result may be higher than the ecl argument if it can be done without increasing the version.
        static encodeBinary(data, ecl) {
            const seg = qrcodegen.QrSegment.makeBytes(data);
            return QrCode.encodeSegments([seg], ecl);
        }
        /*-- Static factory functions (mid level) --*/
        // Returns a QR Code representing the given segments with the given encoding parameters.
        // The smallest possible QR Code version within the given range is automatically
        // chosen for the output. Iff boostEcl is true, then the ECC level of the result
        // may be higher than the ecl argument if it can be done without increasing the
        // version. The mask number is either between 0 to 7 (inclusive) to force that
        // mask, or -1 to automatically choose an appropriate mask (which may be slow).
        // This function allows the user to create a custom sequence of segments that switches
        // between modes (such as alphanumeric and byte) to encode text in less space.
        // This is a mid-level API; the high-level API is encodeText() and encodeBinary().
        static encodeSegments(segs, ecl, minVersion = 1, maxVersion = 40, mask = -1, boostEcl = true) {
            if (!(QrCode.MIN_VERSION <= minVersion && minVersion <= maxVersion && maxVersion <= QrCode.MAX_VERSION)
                || mask < -1 || mask > 7)
                throw new RangeError("Invalid value");
            // Find the minimal version number to use
            let version;
            let dataUsedBits;
            for (version = minVersion;; version++) {
                const dataCapacityBits = QrCode.getNumDataCodewords(version, ecl) * 8; // Number of data bits available
                const usedBits = QrSegment.getTotalBits(segs, version);
                if (usedBits <= dataCapacityBits) {
                    dataUsedBits = usedBits;
                    break; // This version number is found to be suitable
                }
                if (version >= maxVersion) // All versions in the range could not fit the given data
                    throw new RangeError("Data too long");
            }
            // Increase the error correction level while the data still fits in the current version number
            for (const newEcl of [QrCode.Ecc.MEDIUM, QrCode.Ecc.QUARTILE, QrCode.Ecc.HIGH]) { // From low to high
                if (boostEcl && dataUsedBits <= QrCode.getNumDataCodewords(version, newEcl) * 8)
                    ecl = newEcl;
            }
            // Concatenate all segments to create the data bit string
            let bb = [];
            for (const seg of segs) {
                appendBits(seg.mode.modeBits, 4, bb);
                appendBits(seg.numChars, seg.mode.numCharCountBits(version), bb);
                for (const b of seg.getData())
                    bb.push(b);
            }
            assert(bb.length == dataUsedBits);
            // Add terminator and pad up to a byte if applicable
            const dataCapacityBits = QrCode.getNumDataCodewords(version, ecl) * 8;
            assert(bb.length <= dataCapacityBits);
            appendBits(0, Math.min(4, dataCapacityBits - bb.length), bb);
            appendBits(0, (8 - bb.length % 8) % 8, bb);
            assert(bb.length % 8 == 0);
            // Pad with alternating bytes until data capacity is reached
            for (let padByte = 0xEC; bb.length < dataCapacityBits; padByte ^= 0xEC ^ 0x11)
                appendBits(padByte, 8, bb);
            // Pack bits into bytes in big endian
            let dataCodewords = [];
            while (dataCodewords.length * 8 < bb.length)
                dataCodewords.push(0);
            bb.forEach((b, i) => dataCodewords[i >>> 3] |= b << (7 - (i & 7)));
            // Create the QR Code object
            return new QrCode(version, ecl, dataCodewords, mask);
        }
        /*-- Accessor methods --*/
        // Returns the color of the module (pixel) at the given coordinates, which is false
        // for light or true for dark. The top left corner has the coordinates (x=0, y=0).
        // If the given coordinates are out of bounds, then false (light) is returned.
        getModule(x, y) {
            return 0 <= x && x < this.size && 0 <= y && y < this.size && this.modules[y][x];
        }
        /*-- Private helper methods for constructor: Drawing function modules --*/
        // Reads this object's version field, and draws and marks all function modules.
        drawFunctionPatterns() {
            // Draw horizontal and vertical timing patterns
            for (let i = 0; i < this.size; i++) {
                this.setFunctionModule(6, i, i % 2 == 0);
                this.setFunctionModule(i, 6, i % 2 == 0);
            }
            // Draw 3 finder patterns (all corners except bottom right; overwrites some timing modules)
            this.drawFinderPattern(3, 3);
            this.drawFinderPattern(this.size - 4, 3);
            this.drawFinderPattern(3, this.size - 4);
            // Draw numerous alignment patterns
            const alignPatPos = this.getAlignmentPatternPositions();
            const numAlign = alignPatPos.length;
            for (let i = 0; i < numAlign; i++) {
                for (let j = 0; j < numAlign; j++) {
                    // Don't draw on the three finder corners
                    if (!(i == 0 && j == 0 || i == 0 && j == numAlign - 1 || i == numAlign - 1 && j == 0))
                        this.drawAlignmentPattern(alignPatPos[i], alignPatPos[j]);
                }
            }
            // Draw configuration data
            this.drawFormatBits(0); // Dummy mask value; overwritten later in the constructor
            this.drawVersion();
        }
        // Draws two copies of the format bits (with its own error correction code)
        // based on the given mask and this object's error correction level field.
        drawFormatBits(mask) {
            // Calculate error correction code and pack bits
            const data = this.errorCorrectionLevel.formatBits << 3 | mask; // errCorrLvl is uint2, mask is uint3
            let rem = data;
            for (let i = 0; i < 10; i++)
                rem = (rem << 1) ^ ((rem >>> 9) * 0x537);
            const bits = (data << 10 | rem) ^ 0x5412; // uint15
            assert(bits >>> 15 == 0);
            // Draw first copy
            for (let i = 0; i <= 5; i++)
                this.setFunctionModule(8, i, getBit(bits, i));
            this.setFunctionModule(8, 7, getBit(bits, 6));
            this.setFunctionModule(8, 8, getBit(bits, 7));
            this.setFunctionModule(7, 8, getBit(bits, 8));
            for (let i = 9; i < 15; i++)
                this.setFunctionModule(14 - i, 8, getBit(bits, i));
            // Draw second copy
            for (let i = 0; i < 8; i++)
                this.setFunctionModule(this.size - 1 - i, 8, getBit(bits, i));
            for (let i = 8; i < 15; i++)
                this.setFunctionModule(8, this.size - 15 + i, getBit(bits, i));
            this.setFunctionModule(8, this.size - 8, true); // Always dark
        }
        // Draws two copies of the version bits (with its own error correction code),
        // based on this object's version field, iff 7 <= version <= 40.
        drawVersion() {
            if (this.version < 7)
                return;
            // Calculate error correction code and pack bits
            let rem = this.version; // version is uint6, in the range [7, 40]
            for (let i = 0; i < 12; i++)
                rem = (rem << 1) ^ ((rem >>> 11) * 0x1F25);
            const bits = this.version << 12 | rem; // uint18
            assert(bits >>> 18 == 0);
            // Draw two copies
            for (let i = 0; i < 18; i++) {
                const color = getBit(bits, i);
                const a = this.size - 11 + i % 3;
                const b = Math.floor(i / 3);
                this.setFunctionModule(a, b, color);
                this.setFunctionModule(b, a, color);
            }
        }
        // Draws a 9*9 finder pattern including the border separator,
        // with the center module at (x, y). Modules can be out of bounds.
        drawFinderPattern(x, y) {
            for (let dy = -4; dy <= 4; dy++) {
                for (let dx = -4; dx <= 4; dx++) {
                    const dist = Math.max(Math.abs(dx), Math.abs(dy)); // Chebyshev/infinity norm
                    const xx = x + dx;
                    const yy = y + dy;
                    if (0 <= xx && xx < this.size && 0 <= yy && yy < this.size)
                        this.setFunctionModule(xx, yy, dist != 2 && dist != 4);
                }
            }
        }
        // Draws a 5*5 alignment pattern, with the center module
        // at (x, y). All modules must be in bounds.
        drawAlignmentPattern(x, y) {
            for (let dy = -2; dy <= 2; dy++) {
                for (let dx = -2; dx <= 2; dx++)
                    this.setFunctionModule(x + dx, y + dy, Math.max(Math.abs(dx), Math.abs(dy)) != 1);
            }
        }
        // Sets the color of a module and marks it as a function module.
        // Only used by the constructor. Coordinates must be in bounds.
        setFunctionModule(x, y, isDark) {
            this.modules[y][x] = isDark;
            this.isFunction[y][x] = true;
        }
        /*-- Private helper methods for constructor: Codewords and masking --*/
        // Returns a new byte string representing the given data with the appropriate error correction
        // codewords appended to it, based on this object's version and error correction level.
        addEccAndInterleave(data) {
            const ver = this.version;
            const ecl = this.errorCorrectionLevel;
            if (data.length != QrCode.getNumDataCodewords(ver, ecl))
                throw new RangeError("Invalid argument");
            // Calculate parameter numbers
            const numBlocks = QrCode.NUM_ERROR_CORRECTION_BLOCKS[ecl.ordinal][ver];
            const blockEccLen = QrCode.ECC_CODEWORDS_PER_BLOCK[ecl.ordinal][ver];
            const rawCodewords = Math.floor(QrCode.getNumRawDataModules(ver) / 8);
            const numShortBlocks = numBlocks - rawCodewords % numBlocks;
            const shortBlockLen = Math.floor(rawCodewords / numBlocks);
            // Split data into blocks and append ECC to each block
            let blocks = [];
            const rsDiv = QrCode.reedSolomonComputeDivisor(blockEccLen);
            for (let i = 0, k = 0; i < numBlocks; i++) {
                let dat = data.slice(k, k + shortBlockLen - blockEccLen + (i < numShortBlocks ? 0 : 1));
                k += dat.length;
                const ecc = QrCode.reedSolomonComputeRemainder(dat, rsDiv);
                if (i < numShortBlocks)
                    dat.push(0);
                blocks.push(dat.concat(ecc));
            }
            // Interleave (not concatenate) the bytes from every block into a single sequence
            let result = [];
            for (let i = 0; i < blocks[0].length; i++) {
                blocks.forEach((block, j) => {
                    // Skip the padding byte in short blocks
                    if (i != shortBlockLen - blockEccLen || j >= numShortBlocks)
                        result.push(block[i]);
                });
            }
            assert(result.length == rawCodewords);
            return result;
        }
        // Draws the given sequence of 8-bit codewords (data and error correction) onto the entire
        // data area of this QR Code. Function modules need to be marked off before this is called.
        drawCodewords(data) {
            if (data.length != Math.floor(QrCode.getNumRawDataModules(this.version) / 8))
                throw new RangeError("Invalid argument");
            let i = 0; // Bit index into the data
            // Do the funny zigzag scan
            for (let right = this.size - 1; right >= 1; right -= 2) { // Index of right column in each column pair
                if (right == 6)
                    right = 5;
                for (let vert = 0; vert < this.size; vert++) { // Vertical counter
                    for (let j = 0; j < 2; j++) {
                        const x = right - j; // Actual x coordinate
                        const upward = ((right + 1) & 2) == 0;
                        const y = upward ? this.size - 1 - vert : vert; // Actual y coordinate
                        if (!this.isFunction[y][x] && i < data.length * 8) {
                            this.modules[y][x] = getBit(data[i >>> 3], 7 - (i & 7));
                            i++;
                        }
                        // If this QR Code has any remainder bits (0 to 7), they were assigned as
                        // 0/false/light by the constructor and are left unchanged by this method
                    }
                }
            }
            assert(i == data.length * 8);
        }
        // XORs the codeword modules in this QR Code with the given mask pattern.
        // The function modules must be marked and the codeword bits must be drawn
        // before masking. Due to the arithmetic of XOR, calling applyMask() with
        // the same mask value a second time will undo the mask. A final well-formed
        // QR Code needs exactly one (not zero, two, etc.) mask applied.
        applyMask(mask) {
            if (mask < 0 || mask > 7)
                throw new RangeError("Mask value out of range");
            for (let y = 0; y < this.size; y++) {
                for (let x = 0; x < this.size; x++) {
                    let invert;
                    switch (mask) {
                        case 0:
                            invert = (x + y) % 2 == 0;
                            break;
                        case 1:
                            invert = y % 2 == 0;
                            break;
                        case 2:
                            invert = x % 3 == 0;
                            break;
                        case 3:
                            invert = (x + y) % 3 == 0;
                            break;
                        case 4:
                            invert = (Math.floor(x / 3) + Math.floor(y / 2)) % 2 == 0;
                            break;
                        case 5:
                            invert = x * y % 2 + x * y % 3 == 0;
                            break;
                        case 6:

  if(!texte) return null;
  const t = String(texte).toUpperCase().replace(/[^A-Z0-9]/g, "");
  let m = /CC(\d{7})/.exec(t);
  if(!m) m = /(^|[^\d])(\d{7})([^\d]|$)/.exec(t), m = m ? [m[0], m[2]] : null;
  if(!m) return null;
  const chiffres = m[1];
  const aa = parseInt(chiffres.slice(0,2),10), mm = parseInt(chiffres.slice(2,4),10), code = chiffres.slice(4,7);
  const annee = 2000 + aa;
  if(!(mm>=1 && mm<=12)) return null;
  if(!(annee>=2020 && annee<=2099)) return null;
  return [annee + "-" + String(mm).padStart(2,"0"), code];
}

function telephoneNormalise(numero){
  /* Même règle que le serveur : tout ramener à la forme 225XXXXXXXXXX */
  let d = String(numero||"").replace(/\D/g,"");
  if(!d) return "";
  if(d.startsWith("00")) d = d.slice(2);
  if(d.startsWith("0") && [9,11,14].includes(d.length)) d = d.slice(1);
  if(d.length === 8 || d.length === 10) d = "225" + d;
  return d;
}
function accentMin(texte){
  return String(texte||"").normalize("NFKD").replace(/[\u0300-\u036f]/g,"")
    .toLowerCase().replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim();
}
function mots(texte){ return new Set(accentMin(texte).split(" ").filter(x => x.length > 2)); }
function correspondanceNom(a, b){
  const ma = mots(a), mb = mots(b);
  if(!ma.size || !mb.size) return false;
  let communs = 0;
  for(const x of ma) if(mb.has(x)) communs++;
  return communs >= 2 && communs >= Math.min(ma.size, mb.size) - 1;
}

/* Rapproche un paiement d'un membre : référence > téléphone > nom > montant. */
function rapprocherPaiement(p, membres, moisDefaut){
  if(p.statut === "RAPPROCHE" && p.methode === "manuel") return p;
  const ref = analyserReference(p.libelle);
  if(ref){
    const cand = membres.find(m => String(m.code).padStart(3,"0") === ref[1].padStart(3,"0"));
    if(cand){ p.membre_id = cand.id; p.mois = ref[0]; p.statut = "RAPPROCHE"; p.methode = "ref"; return p; }
  }
  const tel = telephoneNormalise(p.telephone);
  if(tel){
    const cands = membres.filter(m => telephoneNormalise(m.telephone) === tel);
    if(cands.length === 1){ p.membre_id = cands[0].id; p.mois = moisDefaut || p.mois;
      p.statut = "RAPPROCHE"; p.methode = "tel"; return p; }
  }
  if(p.expediteur){
    const cands = membres.filter(m => correspondanceNom(m.nom, p.expediteur));
    if(cands.length === 1){ p.membre_id = cands[0].id; p.mois = moisDefaut || p.mois;
      p.statut = "RAPPROCHE"; p.methode = "nom"; return p; }
  }
  if(moisDefaut && p.montant){
    const dus = membres.filter(m => m.actif && !m.exonere && parseInt(m.cotisation,10) === parseInt(p.montant,10));
    if(dus.length === 1){ p.membre_id = dus[0].id; p.mois = moisDefaut; p.statut = "RAPPROCHE";
      p.methode = "montant"; return p; }
  }
  p.methode = "aucun";
  return p;
}

/* Tableau de pointage d'un mois — même calcul que le serveur. */
function pointage(membres, paiements, mois){
  mois = normaliserMois(mois);
  const lignes = [];
  let verseTotal = 0, duTotal = 0, nbPayes = 0, nbPartiels = 0, nbImpayes = 0, nbAvances = 0;
  for(const m of membres){
    if(!m.actif) continue;
    const du = m.exonere ? 0 : parseInt(m.cotisation||0,10);
    duTotal += du;
    const recus = paiements.filter(p => String(p.membre_id) === String(m.id) && normaliserMois(p.mois||"0000-01") === mois);
    const verse = recus.reduce((s,p) => s + parseInt(p.montant,10), 0);
    verseTotal += verse;
    const avances = paiements
      .filter(p => String(p.membre_id) === String(m.id) && p.mois && normaliserMois(p.mois) > mois)
      .reduce((s,p) => s + parseInt(p.montant,10), 0);
    let statut;
    if(du === 0) statut = "EXONERE";
    else if(verse >= du) statut = verse > du ? "AVANCE" : "PAYE";
    else if(verse > 0) statut = "PARTIEL";
    else statut = "IMPAYE";
    if(statut === "PAYE" || statut === "AVANCE"){ nbPayes++; if(statut === "AVANCE") nbAvances++; }
    else if(statut === "PARTIEL") nbPartiels++;
    else if(statut === "IMPAYE") nbImpayes++;
    lignes.push({ membre:m, mois, reference: reference(mois, m.code), du, verse,
      reliquat: Math.max(0, du - verse), statut, avances, nb_paiements: recus.length });
  }
  const deno = nbPayes + nbPartiels + nbImpayes;
  return { mois, libelle: libelleMois(mois), lignes, totaux:{
    du: duTotal, verse: verseTotal, manquant: Math.max(0, duTotal - verseTotal),
    nb_membres: lignes.length, nb_payes: nbPayes, nb_partiels: nbPartiels, nb_impayes: nbImpayes,
    nb_avances: nbAvances,
    taux: deno ? Math.round(1000*nbPayes/deno)/10 : 0 } };
}

function fcfa(n){ return String(parseInt(n,10)||0).replace(/\B(?=(\d{3})+(?!\d))/g, " "); }
function dateFR(iso){ if(!iso) return ""; const p = String(iso).slice(0,10).split("-"); return p.length===3 ? p[2]+"/"+p[1]+"/"+p[0] : iso; }
function aujourdhui(){ return new Date().toISOString().slice(0,10); }

  module.exports = { normaliserMois, moisCourt, moisSuivant, libelleMois, echeance, reference,
    analyserReference, telephoneNormalise, correspondanceNom, rapprocherPaiement, pointage, fcfa };
}

async function sb(table, options){
  options = options || {};
  const entetes = Object.assign({ "apikey": etat.cfg.anon, "Content-Type":"application/json",
    "Authorization": "Bearer " + (etat.session ? etat.session.token : etat.cfg.anon) }, options.headers||{});
  const rep = await fetch(etat.cfg.url.replace(/\/$/,"") + "/rest/v1/" + table,
    Object.assign({}, options, { headers: entetes }));
  if(!rep.ok){
    const corps = await rep.text();
    throw new Error(corps.slice(0,300));
  }
  return rep.status === 204 ? null : await rep.json();
}

/* ------------------------------ QR ------------------------------ */
function qrSvg(texte, px){
  /* Dessine le QR module par module (la lib compilée n'expose que getModule) */
  const qr = qrcodegen.QrCode.encodeText(String(texte), qrcodegen.QrCode.Ecc.MEDIUM);
  const bord = 2, n = qr.size + bord*2;
  let cases = "";
  for(let y = 0; y < qr.size; y++)
    for(let x = 0; x < qr.size; x++)
      if(qr.getModule(x, y))
        cases += '<rect x="'+(x+bord)+'" y="'+(y+bord)+'" width="1" height="1"/>';
  const svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+n+' '+n+'" shape-rendering="crispEdges">'
    + '<rect width="'+n+'" height="'+n+'" fill="#fff"/>'
    + '<g fill="#0A1C2D">'+cases+'</g></svg>';
  return '<div class="qr"><div style="width:'+(px||180)+'px;height:'+(px||180)+'px">'+svg+'</div></div>';
}

function routeActuelle(){
  const h = location.hash || "#/";
  const [chemin, query] = h.slice(2).split("?");
  const params = {};
  (query||"").split("&").forEach(p => { const [k,v] = p.split("="); if(k) params[decodeURIComponent(k)] = decodeURIComponent(v||""); });
  return [chemin || "", params];
}

const PAGES = [
  ["", "Tableau de bord", "vueTableauBord", true],

function entete(){
  const connecte = !!etat.session;

  if(connecte){
    for(const [cle, titre] of PAGES){
      const actif = etat.route === cle ? " on" : "";
      nav += '<a class="'+actif.trim()+'" href="#/'+cle+'">'+titre+'</a>';

    nav = '<a href="#/">Accueil</a><a href="#/connexion">Espace trésorier</a>';

    + '<a class="marque" href="#/"><img src="logo.jpg" alt=""><span class="nom">COMPTA<b>CONNECT</b>'

                : '<a class="btn sm" href="#/connexion">Connexion</a>')
    + '</div><div class="nav">'+nav+'</div></div>';
}

function rendu(){
  const [route, params] = routeActuelle();
  etat.route = route; etat.params = params;
  const app = $("#app");
  let corps = "";
  try{
    if(!etat.cfg) corps = vueInstallation();
    else if(route === "payer") corps = vuePayer(params);
    else if(route === "connexion") corps = vueConnexion();
    else if(route === "installer") corps = vueInstallation();
    else if(!etat.session) corps = vueAccueil();
    else if(route === "") corps = vueTableauBord();
    else if(route === "membres") corps = vueMembres();

    else corps = vueAccueil();
  }catch(e){
    corps = '<main><div class="alerte al-err">Erreur : '+ech(e.message)+'</div></main>';

    + '<div class="grille g2"><div>'
    + '<div class="champ"><span>Code (3 chiffres)</span><input id="mCode" maxlength="3" inputmode="numeric"></div>'
    + '<div class="champ"><span>Nom complet</span><input id="mNom"></div>'
    + '<div class="champ"><span>Téléphone</span><input id="mTel" inputmode="tel"></div>'
    + '</div><div>'
    + '<div class="champ"><span>Ville</span><input id="mVille"></div>'
    + '<div class="champ"><span>Spécialité</span><input id="mSpe"></div>'
    + '<div class="champ"><span>Cotisation mensuelle (FCFA)</span><input id="mCot" value="5000" inputmode="numeric"></div>'
    + '</div></div>'
    + '<button class="btn" onclick="ajouterMembre()">+ Ajouter le membre</button></div>'
    + '<div class="carte"><h3>Importer depuis un relevé (CSV)</h3>'
    + '<p class="mut">Une ligne par membre : <code>code;nom;téléphone;ville</code> (séparateur ; ou , ou tabulation). Les doublons de code sont ignorés.</p>'
    + '<textarea id="csvMembres" placeholder="081;KOUAME Jean;0500000000;Abidjan"></textarea>'
    + '<button class="btn sec" style="margin-top:8px" onclick="importerMembres()">Importer</button></div>'
    + '<div class="carte"><h3>Liste — situation '+libelleMois(mois)+'</h3><div class="survol"><table>'
    + '<tr><th>Code</th><th>Nom</th><th>Téléphone</th><th>Ville</th><th>Cotis.</th><th>'+libelleMois(mois)+'</th><th></th></tr>'
    + etat.membres.map(m => '<tr><td><strong>'+m.code+'</strong></td><td>'+ech(m.nom)+'</td><td>'+ech(m.telephone)+'</td>'
      + '<td>'+ech(m.ville||"")+'</td><td>'+fcfa(m.cotisation)+' F</td><td>'+badge(statutDe[m.id])+'</td>'
      + '<td><button class="btn sm dgr" onclick="supprimerMembre('+m.id+')">✕</button></td></tr>').join("")
    + '</table></div></div></main>';
}
async function ajouterMembre(){
  const code = ($("#mCode").value||"").replace(/\D/g,"").padStart(3,"0");
  const nom = $("#mNom").value.trim();
  if(!nom || code === "000"){ toast("Code et nom obligatoires.", "err"); return; }
  try{
    await sb("membres", { method:"POST", headers:{ "Prefer":"return=minimal" },
      body: JSON.stringify({ code, nom, telephone: $("#mTel").value.trim(), ville: $("#mVille").value.trim(),
        specialite: $("#mSpe").value.trim(), cotisation: parseInt(($("#mCot").value||"5000").replace(/\D/g,""),10)||5000 }) });
    await chargerDonnees(); toast("Membre ajouté.", "ok"); rendu();
  }catch(e){ toast("Ajout refusé : "+e.message, "err"); }
}
async function supprimerMembre(id){
  if(!confirm("Supprimer ce membre ?")) return;
  await sb("membres?id=eq."+id, { method:"DELETE" });
  await chargerDonnees(); rendu();
}
async function importerMembres(){
  const lignes = ($("#csvMembres").value||"").split(/\r?\n/).filter(l => l.trim());
  let nb = 0;
  for(const ligne of lignes){
    const c = ligne.split(/[,;\t]/).map(x => x.trim());
    if(!c[1]) continue;
    try{
      await sb("membres", { method:"POST", headers:{ "Prefer":"return=minimal" },
        body: JSON.stringify({ code: (c[0]||"").replace(/\D/g,"").padStart(3,"0"), nom: c[1],
          telephone: c[2]||"", ville: c[3]||"", cotisation: 5000 }) });
      nb++;
    }catch(e){ /* doublon ignoré */ }
  }
  await chargerDonnees(); toast(nb+" membre(s) importé(s).", "ok"); rendu();
}

/* --------------------------- Pointage --------------------------- */
function vuePointage(params){
  const mois = normaliserMois(params.mois || moisCourant());
  const pt = pointage(etat.membres, etat.paiements, mois);
  const badge = s => ({ PAYE:'<span class="badge b-paye">à jour</span>', PARTIEL:'<span class="badge b-partiel">partiel</span>',
    IMPAYE:'<span class="badge b-impaye">impayé</span>', AVANCE:'<span class="badge b-avance">avance</span>',
    EXONERE:'<span class="badge b-neutre">exonéré</span>' }[s]||"");
  return '<main>'
    + '<div class="carte" style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">'
    + '<h3 style="margin:0">Pointage — '+libelleMois(mois)+'</h3><span style="flex:1"></span>'
    + '<input type="month" value="'+mois+'" style="width:auto" onchange="aller(\'#/pointage?mois=\'+this.value)">'
    + '<button class="btn sec sm" onclick="exporterPointage(\''+mois+'\')">⬇ CSV</button></div>'
    + '<div class="carte"><div class="survol"><table>'
    + '<tr><th>Code</th><th>Membre</th><th>Référence</th><th>Dû</th><th>Versé</th><th>Reste</th><th>Statut</th></tr>'
    + pt.lignes.map(l => '<tr><td>'+l.membre.code+'</td><td>'+ech(l.membre.nom)+'</td>'
      + '<td style="font-family:monospace">'+l.reference+'</td><td>'+fcfa(l.du)+'</td><td>'+fcfa(l.verse)+'</td>'
      + '<td>'+fcfa(l.reliquat)+'</td><td>'+badge(l.statut)+'</td></tr>').join("")
    + '<tr style="font-weight:800;background:var(--vert-eau)"><td colspan="3">TOTAUX — taux '+pt.totaux.taux+' %</td>'
    + '<td>'+fcfa(pt.totaux.du)+'</td><td>'+fcfa(pt.totaux.verse)+'</td><td>'+fcfa(pt.totaux.manquant)+'</td><td></td></tr>'
    + '</table></div></div></main>';
}
function exporterPointage(mois){
  const pt = pointage(etat.membres, etat.paiements, mois);
  let csv = "code;nom;reference;du;verse;reste;statut\n";
  for(const l of pt.lignes)
    csv += [l.membre.code, l.membre.nom, l.reference, l.du, l.verse, l.reliquat, l.statut].join(";") + "\n";
  telecharger("pointage-"+mois+".csv", csv);
}
function telecharger(nom, contenu){
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(["\ufeff"+contenu], {type:"text/csv;charset=utf-8"}));
  a.download = nom; a.click();
}

/* --------------------------- Paiements --------------------------- */
function vuePaiements(params){
  const mois = normaliserMois(params.mois || moisCourant());
  const duMois = etat.paiements.filter(p => normaliserMois(p.mois||"0000-01") === mois)
    .sort((a,b) => String(b.date).localeCompare(String(a.date)));
  const nomDe = id => { const m = etat.membres.find(x => String(x.id) === String(id)); return m ? m.nom : "—"; };
  return '<main>'
    + '<div class="carte" style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">'
    + '<h3 style="margin:0">Paiements — '+libelleMois(mois)+'</h3><span style="flex:1"></span>'
    + '<input type="month" value="'+mois+'" style="width:auto" onchange="aller(\'#/paiements?mois=\'+this.value)"></div>'
    + '<div class="carte"><h3>Importer un relevé (le geste mensuel)</h3>'
    + '<p class="mut">Collez les lignes du relevé mobile money : <code>date;montant;expéditeur;téléphone;motif</code> — '
    + 'un paiement par ligne (date jj/mm/aaaa ou aaaa-mm-jj). Le rapprochement se fait tout seul grâce à la référence du motif.</p>'
    + '<textarea id="csvPaies" placeholder="05/09/2026;5000;KOUASSI AYA;0708112233;Cotisation CC'+moisCourt(mois)+'001"></textarea>'
    + '<button class="btn" style="margin-top:8px" onclick="importerPaiements()">Importer et pointer</button></div>'
    + '<div class="carte"><h3>Saisie manuelle</h3><div class="grille g4">'
    + '<div class="champ"><span>Date</span><input id="pDate" type="date" value="'+aujourdhui()+'"></div>'
    + '<div class="champ"><span>Montant</span><input id="pMont" inputmode="numeric" value="5000"></div>'
    + '<div class="champ"><span>Canal</span><select id="pCanal"><option>Wave</option><option>Orange Money</option><option>MTN MoMo</option><option>Espèces</option><option>Autre</option></select></div>'
    + '<div class="champ"><span>Membre</span><select id="pMembre"><option value="">— détection auto —</option>'
      + etat.membres.map(m => '<option value="'+m.id+'">'+m.code+' · '+ech(m.nom)+'</option>').join("") + '</select></div>'
    + '</div><div class="grille g2">'
    + '<div class="champ"><span>Expéditeur</span><input id="pExp"></div>'
    + '<div class="champ"><span>Motif (référence)</span><input id="pLib" placeholder="CC'+moisCourt(mois)+'042"></div></div>'
    + '<button class="btn" onclick="ajouterPaiement()">Enregistrer</button></div>'
    + '<div class="carte"><h3>Derniers paiements du mois ('+duMois.length+')</h3><div class="survol"><table>'
    + '<tr><th>Date</th><th>Montant</th><th>Canal</th><th>Membre</th><th>Motif</th><th>Détection</th><th></th></tr>'
    + duMois.slice(0,60).map(p => '<tr><td>'+dateFR(p.date)+'</td><td>'+fcfa(p.montant)+' F</td><td>'+ech(p.canal)+'</td>'
      + '<td>'+(p.membre_id ? ech(nomDe(p.membre_id)) : '<span class="badge b-impaye">à pointer</span>')+'</td>'
      + '<td>'+ech(p.libelle)+'</td><td class="mut">'+ech(p.methode)+'</td>'
      + '<td><button class="btn sm dgr" onclick="supprimerPaiement('+p.id+')">✕</button></td></tr>').join("")
    + '</table></div></div></main>';
}
async function ajouterPaiement(){
  const montant = parseInt(($("#pMont").value||"").replace(/\D/g,""),10);
  if(!montant){ toast("Montant invalide.", "err"); return; }
  const p = { date: $("#pDate").value, montant, canal: $("#pCanal").value,
    expediteur: $("#pExp").value.trim(), libelle: $("#pLib").value.trim(), telephone: "" };
  const choix = $("#pMembre").value;
  if(choix){
    const m = etat.membres.find(x => String(x.id) === choix);
    p.membre_id = m.id; p.mois = moisCourant(); p.statut = "RAPPROCHE"; p.methode = "manuel";
  } else {
    rapprocherPaiement(p, etat.membres, moisCourant());
  }
  try{
    await sb("paiements", { method:"POST", headers:{ "Prefer":"return=minimal" }, body: JSON.stringify(p) });
    await chargerDonnees();
    toast(p.membre_id ? "Paiement pointé ✓" : "Paiement enregistré — à pointer manuellement.", "ok");
    rendu();
  }catch(e){ toast("Enregistrement refusé : "+e.message, "err"); }
}
async function importerPaiements(){
  const lignes = ($("#csvPaies").value||"").split(/\r?\n/).filter(l => l.trim());
  if(!lignes.length){ toast("Collez d'abord le relevé.", "err"); return; }
  let nbAuto = 0, nbManuel = 0, corps = [];
  for(const ligne of lignes){
    const c = ligne.split(/[,;\t]/).map(x => x.trim());
    if(c.length < 2) continue;
    let date = c[0]||aujourdhui();
    const dm = /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(date);
    if(dm) date = dm[3]+"-"+dm[2].padStart(2,"0")+"-"+dm[1].padStart(2,"0");
    const montant = parseInt((c[1]||"").replace(/\D/g,""),10)||0;
    if(!montant) continue;
    const p = { date, montant, canal: "Import relevé", expediteur: c[2]||"", telephone: c[3]||"", libelle: c[4]||"" };
    rapprocherPaiement(p, etat.membres, moisCourant());
    if(p.membre_id) nbAuto++; else nbManuel++;
    corps.push(p);
  }
  if(!corps.length){ toast("Aucun paiement valide trouvé.", "err"); return; }
  try{
    await sb("paiements", { method:"POST", headers:{ "Prefer":"return=minimal" }, body: JSON.stringify(corps) });
    await chargerDonnees();
    toast("Import : "+nbAuto+" pointé(s) automatiquement, "+nbManuel+" à pointer.", "ok");
    rendu();
  }catch(e){ toast("Import refusé : "+e.message, "err"); }
}
async function supprimerPaiement(id){
  if(!confirm("Supprimer ce paiement ?")) return;
  await sb("paiements?id=eq."+id, { method:"DELETE" });
  await chargerDonnees(); rendu();
}

/* --------------------------- Paramètres --------------------------- */
function vueParametres(){
  const s = etat.settings;
  const champ = (cle, label, type) => '<div class="champ"><span>'+label+'</span>'
    + '<input id="s_'+cle+'" type="'+(type||"text")+'" value="'+ech(s[cle]||"")+'"></div>';
  return '<main style="max-width:640px"><div class="carte"><h3>Paramètres du réseau</h3>'
    + '<div class="grille g2">'
    + champ("reseau","Nom du réseau") + champ("slogan","Slogan")
    + champ("cotisation","Cotisation mensuelle (FCFA)","number") + champ("jour_echeance","Jour d'échéance","number")
    + champ("tresorier","Trésorier") + champ("tresorier_tel","Téléphone trésorier","tel")
    + champ("contact_email","Email de contact","email") + champ("site_web","Site web")
    + champ("wave_numero","Numéro Wave") + champ("om_numero","Numéro Orange Money")
    + champ("mtn_numero","Numéro MTN MoMo")
    + '</div><button class="btn blk" onclick="enregistrerParametres()">Enregistrer</button>'
    + '<hr style="border:none;border-top:1px solid var(--ligne);margin:14px 0">'
    + '<p class="mut">Connecté en tant que : '+ech(etat.session?etat.session.email:"")
    + ' · <a href="#/installer">Changer de projet Supabase</a></p>'
    + '</div></main>';
}
async function enregistrerParametres(){
  const cles = ["reseau","slogan","cotisation","jour_echeance","tresorier","tresorier_tel",
    "contact_email","site_web","wave_numero","om_numero","mtn_numero"];
  try{
    for(const cle of cles){
      const valeur = $("#s_"+cle).value.trim();
      await sb("settings", { method:"POST",
        headers:{ "Prefer":"resolution=merge-duplicates" },
        body: JSON.stringify({ cle, valeur }) });
    }
    await chargerDonnees(); toast("Paramètres enregistrés.", "ok"); rendu();
  }catch(e){ toast("Enregistrement refusé : "+e.message, "err"); }
}

/* --------------------------- Démarrage --------------------------- */
window.addEventListener("hashchange", rendu);
(async function(){
  cfgCharger(); sessionCharger();
  if(etat.cfg){
    try{ await chargerDonnees(); }
    catch(e){ console.warn("chargement:", e.message); }
  }
  rendu();
})();
</script>
