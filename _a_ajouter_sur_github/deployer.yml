name: Tests et déploiement

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  tests:
    name: Tests automatiques
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Installer libzbar (décodage des QR codes)
        run: sudo apt-get update && sudo apt-get install -y libzbar0

      - name: Lancer les tests
        run: python -m pytest tests/ -v

  deploiement:
    name: Déploiement Render
    runs-on: ubuntu-latest
    needs: tests
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Déclencher le déploiement
        env:
          # À ajouter dans Settings → Secrets and variables → Actions du dépôt.
          # Sans ce secret, cette étape est simplement ignorée.
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "RENDER_DEPLOY_HOOK_URL non défini : déploiement ignoré."
            exit 0
          fi
          curl --fail --silent --show-error "$HOOK"
          echo "Déploiement déclenché."
